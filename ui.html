        return sid;
      }

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === "plugin-error") {
          if (loadingInterval) clearInterval(loadingInterval);
          if (handoffPendingRefreshState) {
            const snapshot = handoffPendingRefreshState;
            handoffPendingRefreshState = null;
            handoffPendingRefreshScroll = null;
            isRefreshingComponents = false;
            handoffRestoreSnapshotState(snapshot);
            showSnackbar("Could not refresh scan");
            return;
          }
          console.error("Plugin error:", msg.message);
          alert("A plugin error occurred: " + msg.message);
          setState(STATE.READY);
          return;
        }

        if (msg.type === "apply-writing-guideline-result") {
          if (msg.success) {
            showSnackbar("ARIA text applied to the selected handoff card.");
          } else if (msg.reason === "no-selection") {
            showSnackbar(
              "Select a handoff card in Figma before applying ARIA text."
            );
          } else if (msg.reason === "label-not-found") {
            showSnackbar(
              "ARIA field not found on the card. Generate the handoff with Custom A11y enabled."
            );
          } else {
            showSnackbar("Could not apply ARIA text to the card.");
          }
          return;
        }

        if (msg.type === "figma-text-pick-result") {
          const componentId = msg.componentId;
          const fieldKey = msg.fieldKey;
          const text =
            typeof msg.text === "string" ? msg.text : String(msg.text || "");
          const resolvedId = handoffResolveComponentDetailsId(componentId);
          if (resolvedId && fieldKey) {
            handoffPushUndoState();
            ensureComponentDetails(resolvedId);
            const details = componentDetails[resolvedId];
            if (!details.customData) details.customData = {};
            if (
              !details.customData[fieldKey] ||
              typeof details.customData[fieldKey] !== "object"
            ) {
              details.customData[fieldKey] = { enabled: true, text: "" };
            }
            details.customData[fieldKey].text = text;
          }
          let refreshed = false;
          try {
            const ta = document.querySelector(
              "textarea[data-figma-pick-component=\"" +
                CSS.escape(String(componentId)) +
                "\"][data-figma-pick-key=\"" +
                CSS.escape(String(fieldKey)) +
                "\"]"
            );
            if (ta) {
              ta.value = text;
              ta.dispatchEvent(new Event("input", { bubbles: true }));
              refreshed = true;
            }
          } catch (err) {
            console.warn("figma-text-pick-result:", err);
          }
          if (!refreshed && resolvedId) {
            handoffApplyFieldEditRefresh(resolvedId);
          }
          showSnackbar("Figma text applied to the field.");
          return;
        }

        if (msg.type === "scan-components-result") {
          const payload = msg.payload;
          const finishScanResult = () => {
            if (loadingInterval) clearInterval(loadingInterval);
            const refreshState = handoffPendingRefreshState;
            const refreshScroll = handoffPendingRefreshScroll;
            handoffPendingRefreshState = null;
            handoffPendingRefreshScroll = null;
            isRefreshingComponents = false;

            let incoming = normalizeScanComponentTypes(
              payload.components || []
            );
            if (refreshState) {
              incoming = handoffMergeRefreshComponents(
                incoming,
                refreshState.detectedComponents
              );
              componentDetails =
                handoffClonePlain(refreshState.componentDetails) || {};
            } else {
              componentDetails = {};
              handoffClearUndoHistory();
            }

            expandedContainerIds.clear();
            (refreshState ? refreshState.expandedContainerIds || [] : []).forEach(
              (id) => expandedContainerIds.add(id)
            );
            expandedChildCardIds.clear();
            (refreshState ? refreshState.expandedChildCardIds || [] : []).forEach(
              (id) => expandedChildCardIds.add(id)
            );
            handoffNewManualHighlightIds.clear();
            (refreshState ? refreshState.handoffNewManualHighlightIds || [] : []).forEach(
              (id) => handoffNewManualHighlightIds.add(id)
            );
            handoffPendingManualAddAnimId = refreshState
              ? refreshState.handoffPendingManualAddAnimId || null
              : null;
            incoming.forEach(function (comp) {
              if (!comp || !comp.id) return;
              if (!componentDetails[comp.id]) applyHandoffRegistryDefaults(comp);
              else ensureComponentDetails(comp.id);
            });
            materializePresetGroupingChildren(incoming);
            incoming.forEach(function (comp) {
              if (!comp || !comp.id) return;
              if (!componentDetails[comp.id]) applyHandoffRegistryDefaults(comp);
              else ensureComponentDetails(comp.id);
            });
            detectedComponents = incoming;
            lastScanRootId =
              typeof payload.scanRootId === "string" && payload.scanRootId
                ? payload.scanRootId
                : null;
            createScreenTitleOnScan();
            handoffFlattenMisnestedGroupingBundles();
            if (refreshState) handoffSyncSortYToGlobalDfsOrder();
            else handoffRebuildOrderFromScanPositions();
            incoming.forEach(function (comp) {
              if (!comp || !comp.id) return;
              handoffSyncComponentReviewStatus(comp.id);
            });
            if (payload.error) {
              alert(payload.error);
            }
            if (refreshState) {
              saveGroupingToStorage();
              currentState = STATE.RESULTS_COMPONENT;
              renderResultsComponent(
                typeof refreshScroll === "number" ? refreshScroll : 0
              );
            } else {
              try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
              setState(STATE.RESULTS_COMPONENT);
            }
          };
          if (handoffPendingRefreshState) finishScanResult();
          else waitRemainingMinLoading(finishScanResult);
        }

        if (msg.type === "scan-design-system-result") {
          const payload = msg.payload;
          waitRemainingMinLoading(() => {
            if (loadingInterval) clearInterval(loadingInterval);
            dsSummary = payload.summary || { passed: 0, warnings: 0, failed: 0 };
            dsCategories = payload.categories || [];
            if (payload.error) {
              alert(payload.error);
            }
            setState(STATE.RESULTS_DS);
          });
        }
      };

      if (typeof HomeScreens === "undefined") {
        app.innerHTML =
          '<div style="padding:16px;font:14px Inter,sans-serif;color:#111;">Failed to load home screen UI. Reload the plugin.</div>';
      } else {
        HomeScreens.init({
          app: app,
          STATE: STATE,
          setState: setState,
          startLoading: startLoading,
          postToPlugin: postToPlugin,
        });
        applyPluginUIHeight(getPluginUIHeightForState(currentState));
        render();
      }

    </script>
  </body>
</html>
