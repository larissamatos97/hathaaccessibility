        renderList();

        content.appendChild(statsRow);
        content.appendChild(titleAndActionsRow);
        content.appendChild(listContainer);

        const footer = document.createElement("div");
        footer.className = "footer";

        const resizeHandle = document.createElement("button");
        resizeHandle.type = "button";
        resizeHandle.className = "component-height-resize-handle";
        resizeHandle.title = "Drag to resize height";
        resizeHandle.setAttribute("aria-label", "Resize plugin height");
        bindComponentHeightResize(resizeHandle);

        const footerInner = document.createElement("div");
        footerInner.className = "footer-inner";

        const primary = document.createElement("button");
        primary.className = "button-primary button-primary-pink";
        primary.textContent = "Confirm";

        function computeValidationErrors() {
          const duplicateIds = handoffBuildDuplicateIndexIdSet();
          let count = 0;
          buildFlattenedOrder().forEach((compId) => {
            if (handoffComponentNeedsAttention(compId, duplicateIds)) count += 1;
          });
          lastValidationErrorCount = count;
          return count;
        }

        function updateConfirmState() {
          const errors = computeValidationErrors();
          primary.disabled = detectedComponents.length === 0 || errors > 0;
        }

        primary.onclick = () => {
          const errors = computeValidationErrors();
          if (errors > 0) {
            showValidationErrors = true;
            showSnackbar(
              `${errors} component(s) need attention (enabled fields without text, empty screen title, duplicate index, or containers without type selection).`
            );
            renderResultsComponent();
            return;
          }
          showValidationErrors = false;
          handoffClearUndoHistory();
          setState(STATE.PREVIEW);
        };

        updateConfirmState();

        handoffAfterFieldEdit = function () {
          recalcStats();
          updateConfirmState();
        };

        footerInner.appendChild(primary);
        footer.appendChild(resizeHandle);
        footer.appendChild(footerInner);

        app.appendChild(header);
        app.appendChild(content);
        app.appendChild(footer);

        let actionsPinRaf = null;
        content.addEventListener(
          "scroll",
          () => {
            if (actionsPinRaf != null) return;
            actionsPinRaf = requestAnimationFrame(() => {
              actionsPinRaf = null;
              syncHandoffActionsPinned(true);
            });
          },
          { passive: true }
        );

        if (savedScroll != null) {
          requestAnimationFrame(() => {
            content.scrollTop = savedScroll;
            syncHandoffActionsPinned(false);
          });
        } else {
          requestAnimationFrame(() => {
            syncHandoffActionsPinned(false);
          });
        }
        if (handoffPendingManualAddAnimId) {
          const animId = handoffPendingManualAddAnimId;
          handoffPendingManualAddAnimId = null;
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              handoffRunManualAddScrollAnimation(animId);
            });
          });
        }
      }

      const STORAGE_KEY = "wellhub-handoff-grouping";
      const SCREEN_TITLE_TYPE = "Screen Title";
      const SCREEN_TITLE_FIXED_ID = "__wellhub-screen-title__";
      const SCREEN_TITLE_INTRO_COPY =
        "\u201cTitle element\u201d for the screen, with the following name:";
      const SCREEN_TITLE_FIELD_PLACEHOLDER =
        "Enter the name of the screen this card refers to., e.g. Check-in Tab";

      const MANUAL_ADD_MENU_TYPES = [
        "Accordion",
        "Banner",
        "Button",
        "Checkbox",
        "Chips",
        "Input",
        "Loader",
        "QR Code",
        "Radio Button",
        "Screen Title",
        "SnackBar",
        "Switch",
        "Tags",
        "Text Body",
        "Text Headline",
      ].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));

      function handoffMarkManualNewHighlight(compId) {
        if (compId == null || compId === "") return;
        handoffNewManualHighlightIds.add(String(compId));
      }

      function handoffClearManualNewHighlight(compId) {
        if (compId == null || compId === "") return;
        handoffNewManualHighlightIds.delete(String(compId));
      }

      function handoffDismissManualNewHighlight(compId, cardEl) {
        if (!handoffNewManualHighlightIds.has(String(compId))) return;
        handoffClearManualNewHighlight(compId);
        if (cardEl) cardEl.classList.remove("component-card--new-manual");
      }

      function handoffGetMaxTopLevelSortY() {
        let max = -1;
        detectedComponents.forEach(function (c) {
          const pid = componentDetails[c.id]?.parentId;
          if (pid != null && pid !== "") return;
          if (isScreenTitleComp(c)) return;
          const y = c._sortY != null ? c._sortY : 0;
          if (y > max) max = y;
        });
        return max;
      }

      function handoffRunManualAddScrollAnimation(compId) {
        const scrollableEl = document.querySelector(".content.content-results-component");
        if (!scrollableEl || compId == null) return;
        const row = scrollableEl.querySelector(
          '[data-handoff-row-id="' + handoffEscapeAttr(compId) + '"]'
        );
        if (!row) return;
        const last = row.getBoundingClientRect();
        const firstRect = {
          top: last.top + 48,
          bottom: last.bottom + 48,
          left: last.left,
          right: last.right,
          width: last.width,
          height: last.height,
        };
        handoffRunReorderFlipAnimation(scrollableEl, compId, firstRect);
      }

      function getManualAddMenuTypes() {
        let types = MANUAL_ADD_MENU_TYPES.slice();
        if (detectedComponents.some(isScreenTitleComp)) {
          types = types.filter((t) => t !== "Screen Title");
        }
        return types;
      }

      function resolveHandoffTypeFromMenuLabel(menuLabel) {
        if (menuLabel === "Input" || menuLabel === "Screen Title") return menuLabel;
        if (typeof WELLHUB_COMPONENT_REGISTRY === "undefined") return menuLabel;
        const registryType = WELLHUB_COMPONENT_REGISTRY.lookupRegistryTypeName(menuLabel);
        if (!registryType) return menuLabel;
        if (registryType === "Button") return "Button";
        if (registryType === "Tag") return "Tags";
        return registryType;
      }

      function handoffChildTypeFromRegistrySubType(subType) {
        if (subType === "Button") return "Button";
        return subType;
      }

      function buildManualPresetListItems(groupingSpec) {
        if (!groupingSpec || !Array.isArray(groupingSpec.subComponents)) return [];
        const items = [];
        let sortY = 0;
        const stamp = Date.now();
        groupingSpec.subComponents.forEach(function (sub, subIdx) {
          if (!sub || !sub.type) return;
          const maxCount = sub.maxCount || 1;
          for (let i = 0; i < maxCount; i++) {
            const childType = handoffChildTypeFromRegistrySubType(sub.type);
            items.push({
              id: "manual-" + stamp + "-" + subIdx + "-" + i + "-" + Math.random(),
              name: "New " + childType,
              type: childType,
              _sortY: sortY,
              _sortX: 0,
              _scanSortY: sortY,
              _scanSortX: 0,
            });
            sortY += 1;
          }
        });
        return items;
      }

      function addManualHandoffComponent(menuLabel) {
        if (menuLabel === "Screen Title") {
          createScreenTitleOnScan();
          handoffMarkManualNewHighlight(SCREEN_TITLE_FIXED_ID);
          expandedContainerIds.add(SCREEN_TITLE_FIXED_ID);
          return SCREEN_TITLE_FIXED_ID;
        }

        const registryType =
          typeof WELLHUB_COMPONENT_REGISTRY !== "undefined"
            ? WELLHUB_COMPONENT_REGISTRY.lookupRegistryTypeName(menuLabel)
            : null;
        const resolvedRegistryType =
          registryType || (menuLabel === "Input" ? "Input" : menuLabel);
        const handoffType = resolveHandoffTypeFromMenuLabel(menuLabel);
        const newId = "manual-" + Date.now() + "-" + Math.random();
        const R = typeof WELLHUB_COMPONENT_REGISTRY !== "undefined" ? WELLHUB_COMPONENT_REGISTRY : null;
        const groupingSpec = R ? R.getGroupingSpec(resolvedRegistryType) : null;
        const internalSpec = R ? R.getInternalReadSpec(resolvedRegistryType) : null;

        let comp;
        if (groupingSpec && R) {
          const displayType = R.getGroupingDisplayType(resolvedRegistryType);
          comp = {
            id: newId,
            name: "New " + resolvedRegistryType,
            type: displayType,
            presetGrouping: true,
            listItems: buildManualPresetListItems(groupingSpec),
          };
        } else if (internalSpec && R) {
          const displayType = R.getGroupingDisplayType(resolvedRegistryType);
          comp = {
            id: newId,
            name: "New " + resolvedRegistryType,
            type: displayType,
            presetGrouping: true,
            manualInternalReadContainer: true,
            listItems: [],
          };
        } else {
          comp = {
            id: newId,
            name: "New " + handoffType,
            type: handoffType,
          };
        }

        comp._sortY = handoffGetMaxTopLevelSortY() + 1;
        comp._sortX = 0;
        detectedComponents.push(comp);
        if (groupingSpec || internalSpec) {
          materializePresetGroupingChildren(detectedComponents);
          expandedContainerIds.add(newId);
        }
        applyHandoffRegistryDefaults(comp);
        if (groupingSpec) {
          getChildrenIds(newId).forEach(function (childId) {
            const child = getCompById(childId);
            if (child) applyHandoffRegistryDefaults(child);
          });
        }
        ensureComponentDetails(newId);
        handoffMarkManualNewHighlight(newId);
        handoffSyncSortYToGlobalDfsOrder();
        return newId;
      }

      function isScreenTitleComp(comp) {
        return !!(comp && String(comp.type) === SCREEN_TITLE_TYPE);
      }

      function isScreenTitleCompId(compId) {
        const comp = getCompById(compId);
        return isScreenTitleComp(comp);
      }

      function getScreenTitleText(compId) {
        const det = componentDetails[compId];
        const st = det && det.customData && det.customData.screenTitle;
        return st && typeof st.text === "string" ? st.text : "";
      }

      function ensureScreenTitleDetails(compId) {
        ensureComponentDetails(compId);
        const det = componentDetails[compId];
        det.isScreenTitle = true;
        det.mode = "screen-title";
        if (!det.customData) det.customData = {};
        if (
          !det.customData.screenTitle ||
          typeof det.customData.screenTitle !== "object"
        ) {
          det.customData.screenTitle = { enabled: true, text: "" };
        } else {
          det.customData.screenTitle.enabled = true;
        }
      }

      function dedupeScreenTitleComps() {
        const screenTitles = detectedComponents.filter(isScreenTitleComp);
        if (screenTitles.length <= 1) return;
        const keepId = screenTitles[0].id;
        detectedComponents = detectedComponents.filter(
          (c) => !isScreenTitleComp(c) || handoffSameId(c.id, keepId)
        );
      }

      function createScreenTitleOnScan() {
        dedupeScreenTitleComps();
        let screenTitle = detectedComponents.find(isScreenTitleComp);
        if (!screenTitle) {
          screenTitle = {
            id: SCREEN_TITLE_FIXED_ID,
            name: "Screen Title",
            type: SCREEN_TITLE_TYPE,
            _sortY: -1,
            _sortX: 0,
          };
          detectedComponents.unshift(screenTitle);
        } else {
          detectedComponents = detectedComponents.filter((c) => !isScreenTitleComp(c));
          detectedComponents.unshift(screenTitle);
        }
        screenTitle._sortY = -1;
        screenTitle._sortX = 0;
        ensureScreenTitleDetails(screenTitle.id);
        if (!componentDetails[screenTitle.id].status) {
          componentDetails[screenTitle.id].status = "needs-review";
        }
      }

      function buildNumberedFlattenedOrder() {
        return buildFlattenedOrder().filter((id) => !isScreenTitleCompId(id));
      }

      function saveGroupingToStorage() {}

      function handoffSameId(a, b) {
        if (a === b) return true;
        if (a == null || b == null) return false;
        return String(a) === String(b);
      }

      function ensureComponentDetails(id) {
        if (!componentDetails[id]) {
          componentDetails[id] = {
            id,
            mode: "standard",
            standardData: {},
            customData: {},
            parentId: null,
            containerType: null,
          };
        }
      }

      function handoffCanonicalCompId(id) {
        return id == null ? null : String(id);
      }

      /** Índice global exibido (1-based); chaves do map sempre em string. */
      function handoffLookupGlobalIndex(globalIndexMap, compId) {
        if (compId == null || compId === "") return 1;
        const key = handoffCanonicalCompId(compId);
        if (globalIndexMap && globalIndexMap.has(key)) {
          return globalIndexMap.get(key);
        }
        const c = getCompById(compId);
        if (isScreenTitleComp(c)) return 0;
        if (c && c._sortY != null && c._sortY >= 0) return c._sortY + 1;
        return 1;
      }

      function handoffGetParentId(compId) {
        const key = handoffCanonicalCompId(compId);
        const det =
          componentDetails[compId] ||
          (key ? componentDetails[key] : null);
        const pid = det && det.parentId;
        return pid == null || pid === "" ? null : pid;
      }

      function handoffIsRootComponent(compId) {
        return handoffGetParentId(compId) == null;
      }

      /** Ordena irmãos: siblingOrder explícito (pós-reorder) → scan → _sortY. */
      function handoffCompareSiblingOrder(a, b) {
        if (!a || !b) return 0;
        const da = componentDetails[a.id];
        const db = componentDetails[b.id];
        const oa = da && da.siblingOrder != null ? da.siblingOrder : null;
        const ob = db && db.siblingOrder != null ? db.siblingOrder : null;
        if (oa != null && ob != null && oa !== ob) return oa - ob;
        return handoffCompareComps(a, b);
      }

      function handoffGetChildCompsForParent(parentId) {
        if (parentId == null || parentId === undefined) {
          return detectedComponents.filter(function (c) {
            return handoffIsRootComponent(c.id);
          });
        }
        return detectedComponents.filter(function (c) {
          return handoffSameId(handoffGetParentId(c.id), parentId);
        });
      }

      /** Garante siblingOrder em irmãos que ainda não têm (não sobrescreve reordenação manual). */
      function handoffEnsureSiblingOrderSeeded() {
        function walk(parentId) {
          const children = handoffGetChildCompsForParent(parentId);
          if (!children.length) return;
          const needsSeed = children.some(function (c) {
            const d = componentDetails[c.id];
            return !d || d.siblingOrder == null;
          });
          if (needsSeed) {
            children.sort(handoffCompareSiblingOrder);
            children.forEach(function (c, i) {
              ensureComponentDetails(c.id);
              componentDetails[c.id].siblingOrder = i;
            });
          }
          children.forEach(function (c) {
            walk(c.id);
          });
        }
        walk(null);
      }

      function isPresetGroupingComp(comp) {
        if (!comp) return false;
        if (comp.presetGrouping) return true;
        return !!(comp.type && String(comp.type).indexOf("• Grouping") >= 0);
      }

      function isPresetGroupingChild(compId) {
        const det = componentDetails[compId];
        if (det && det.presetGroupingChild) return true;
        const comp = getCompById(compId);
        return !!(comp && comp.presetGroupingChild);
      }

      /** Container manual (List/Grouping) com filhos — exclui presets Snackbar/Heading etc. */
      function isManualListOrGroupingContainer(compId) {
        const comp = getCompById(compId);
        if (!comp || isPresetGroupingComp(comp)) return false;
        return getChildrenIds(compId).length > 0;
      }

      function handoffDeleteIncludesEntireList(compId) {
        const comp = getCompById(compId);
        if (!comp) return false;
        const type = comp.type || "";
        const listGroupingTypes = ["List", "Grouping", "Ordered list"];
        if (listGroupingTypes.indexOf(type) >= 0) {
          if (comp.listItems && comp.listItems.length > 0) return true;
          if (getChildrenIds(compId).length > 0) return true;
        }
        if (isPresetGroupingComp(comp) && getChildrenIds(compId).length > 0) return true;
        if (isManualListOrGroupingContainer(compId)) return true;
        const det = componentDetails[compId];
        if (det && det.containerType && getChildrenIds(compId).length > 0) return true;
        return false;
      }

      function handoffCreateManualContainerAtTarget(targetCompId) {
        const targetComp = getCompById(targetCompId);
        const containerId = "group-" + Date.now() + "-" + Math.random();
        const containerNode = {
          id: containerId,
          name: "Grouping",
          type: "Grouping",
        };
        if (targetComp) {
          if (targetComp._scanSortY != null) {
            containerNode._scanSortY = targetComp._scanSortY;
            containerNode._scanSortX =
              targetComp._scanSortX != null ? targetComp._scanSortX : 0;
          }
          if (targetComp._sortY != null) {
            containerNode._sortY = targetComp._sortY;
            containerNode._sortX = targetComp._sortX != null ? targetComp._sortX : 0;
          }
        }
        const insertAt = detectedComponents.findIndex((c) =>
          handoffSameId(c.id, targetCompId)
        );
        if (insertAt >= 0) detectedComponents.splice(insertAt, 0, containerNode);
        else detectedComponents.push(containerNode);
        ensureComponentDetails(containerId);
        componentDetails[containerId].containerType = null;
        const targetParent = componentDetails[targetCompId]
          ? componentDetails[targetCompId].parentId
          : null;
        componentDetails[containerId].parentId = targetParent || null;
        return containerId;
      }

      function handoffSetSiblingOrderUnderParent(parentId, orderedChildIds) {
        orderedChildIds.forEach((id, i) => {
          ensureComponentDetails(id);
          componentDetails[id].siblingOrder = i;
          const c = getCompById(id);
          if (c) {
            c._sortY = i;
            c._sortX = 0;
          }
        });
      }

      function handoffIsSyntheticGroupingContainer(compId) {
        return String(compId).indexOf("group-") === 0;
      }

      /** Card manual com filhos (shell group-* ou grouping/list já formado). */
      function handoffIsGroupingBundle(compId) {
        if (getChildrenIds(compId).length === 0) return false;
        const comp = getCompById(compId);
        if (!comp) return false;
        if (handoffIsSyntheticGroupingContainer(compId)) return true;
        if (isPresetGroupingComp(comp)) return true;
        if (isManualListOrGroupingContainer(compId)) return true;
        const det = componentDetails[compId];
        if (det && det.containerType) return true;
        const t = comp.type || "";
        return t === "Grouping" || t === "List" || t === "Ordered list";
      }

      /** Lista pai: shell raiz, preset, group-* manual ou List/Grouping/Ordered list. */
      function handoffIsListShell(compId) {
        if (!handoffIsGroupingBundle(compId)) return false;
        const det = componentDetails[compId];
        const pid = det && det.parentId;
        if (pid != null && pid !== "") return false;
        const comp = getCompById(compId);
        if (isPresetGroupingComp(comp)) return true;
        if (handoffIsSyntheticGroupingContainer(compId)) return true;
        if (det && det.containerType) return true;
        const t = comp.type || "";
        if (t === "List" || t === "Grouping" || t === "Ordered list") return true;
        if (isManualListOrGroupingContainer(compId)) return true;
        return false;
      }

      /** Grouping filho dentro de uma lista (tem pai e é bundle). */
      function handoffIsListChildGroupingBundle(compId) {
        const det = componentDetails[compId];
        const pid = det && det.parentId;
        if (pid == null || pid === "") return false;
        return handoffIsGroupingBundle(compId);
      }

      /** Sobe do alvo até achar o shell da lista onde inserir irmãos. */
      function handoffResolveListShellForInsert(targetCompId) {
        let id = targetCompId;
        while (id != null && id !== "") {
          if (handoffIsListShell(id)) return id;
          const pid = componentDetails[id] && componentDetails[id].parentId;
          if (pid == null || pid === "") break;
          id = pid;
        }
        return targetCompId;
      }

      /** Filhos diretos do shell que ainda não são sub-grouping (Text, Button, etc.). */
      function handoffGetLooseChildIdsUnderListShell(listShellId) {
        return getChildrenIds(listShellId).filter(function (id) {
          return !handoffIsGroupingBundle(id);
        });
      }

      /**
       * Agrupa filhos soltos do pai em um sub-group-* (Grouping 01) antes de adicionar outro grouping.
       */
      function handoffWrapLooseChildrenInSubGrouping(listShellId) {
        const looseIds = handoffGetLooseChildIdsUnderListShell(listShellId);
        if (!looseIds.length) return null;

        const shellSiblings = getChildrenIds(listShellId);
        let insertAt = shellSiblings.findIndex(function (id) {
          return handoffSameId(id, looseIds[0]);
        });
        if (insertAt < 0) insertAt = shellSiblings.length;

        const anchor = getCompById(looseIds[0]);
        const containerId = "group-" + Date.now() + "-" + Math.random();
        const containerNode = {
          id: containerId,
          name: "Grouping",
          type: "Grouping",
        };
        if (anchor) {
          if (anchor._sortY != null) {
            containerNode._sortY = anchor._sortY;
            containerNode._sortX = anchor._sortX != null ? anchor._sortX : 0;
          }
          if (anchor._scanSortY != null) {
            containerNode._scanSortY = anchor._scanSortY;
            containerNode._scanSortX =
              anchor._scanSortX != null ? anchor._scanSortX : 0;
          }
        }
        detectedComponents.push(containerNode);
        ensureComponentDetails(containerId);
        componentDetails[containerId].parentId = listShellId;
        componentDetails[containerId].containerType = null;

        looseIds.forEach(function (childId) {
          ensureComponentDetails(childId);
          componentDetails[childId].parentId = containerId;
        });
        handoffSetSiblingOrderUnderParent(containerId, looseIds);

        const newShellSiblings = shellSiblings.filter(function (id) {
          return !looseIds.some(function (lid) {
            return handoffSameId(lid, id);
          });
        });
        newShellSiblings.splice(insertAt, 0, containerId);
        handoffSetSiblingOrderUnderParent(listShellId, newShellSiblings);
        expandedContainerIds.add(containerId);
        expandedContainerIds.add(listShellId);
        return containerId;
      }

      /**
       * Corrige groupings aninhados indevidamente (filho grouping dentro de outro grouping).
       * Promove para irmão sob o mesmo shell da lista.
       */
      function handoffFlattenMisnestedGroupingBundles() {
        let anyChanged = false;
        let changed = true;
        while (changed) {
          changed = false;
          detectedComponents.forEach(function (c) {
            if (!handoffIsListChildGroupingBundle(c.id)) return;
            const pid = componentDetails[c.id].parentId;
            if (!pid || !handoffIsListChildGroupingBundle(pid)) return;
            const listShell = componentDetails[pid].parentId;
            if (!listShell) return;
            componentDetails[c.id].parentId = listShell;
            const siblings = getChildrenIds(listShell).filter(function (sid) {
              return !handoffSameId(sid, c.id);
            });
            const parentIdx = siblings.findIndex(function (sid) {
              return handoffSameId(sid, pid);
            });
            if (parentIdx >= 0) siblings.splice(parentIdx + 1, 0, c.id);
            else siblings.push(c.id);
            handoffSetSiblingOrderUnderParent(listShell, siblings);
            changed = true;
            anyChanged = true;
          });
        }
        if (anyChanged) {
          handoffSyncSortYToGlobalDfsOrder();
        }
      }

      /** Metade superior do alvo → inserir antes; inferior → depois. */
      function handoffResolveDropInsertHint(e, fallbackTargetId) {
        if (!e) {
          return fallbackTargetId
            ? { targetId: fallbackTargetId, before: false }
            : null;
        }
        const childEl = e.target.closest(".child-card");
        if (childEl) {
          const targetId = childEl.getAttribute("data-handoff-row-id");
          if (targetId) {
            const rect = childEl.getBoundingClientRect();
            return {
              targetId: targetId,
              before: e.clientY < rect.top + rect.height / 2,
            };
          }
        }
        const groupedContainer = e.target.closest(".grouped-items-container");
        if (groupedContainer) {
          const children = groupedContainer.querySelectorAll(
            ".child-card[data-handoff-row-id]"
          );
          if (children.length) {
            const rect = groupedContainer.getBoundingClientRect();
            const before = e.clientY < rect.top + rect.height / 2;
            const pick = before ? children[0] : children[children.length - 1];
            return {
              targetId: pick.getAttribute("data-handoff-row-id"),
              before: before,
            };
          }
        }
        const cardEl = e.target.closest(".component-card[data-comp-id]");
        if (cardEl && cardEl.dataset.compId) {
          const rect = cardEl.getBoundingClientRect();
          return {
            targetId: cardEl.dataset.compId,
            before: e.clientY < rect.top + rect.height / 2,
          };
        }
        return fallbackTargetId
          ? { targetId: fallbackTargetId, before: false }
          : null;
      }

      function handoffBuildListInsertSpec(listShellId, targetCompId, dropHint) {
        if (dropHint && dropHint.targetId) {
          const tid = dropHint.targetId;
          if (handoffSameId(componentDetails[tid]?.parentId, listShellId)) {
            return { targetId: tid, before: !!dropHint.before };
          }
          if (handoffSameId(tid, listShellId)) {
            const shellChildren = getChildrenIds(listShellId);
            if (!shellChildren.length) return null;
            return dropHint.before
              ? { targetId: shellChildren[0], before: true }
              : {
                  targetId: shellChildren[shellChildren.length - 1],
                  before: false,
                };
          }
        }
        if (handoffSameId(componentDetails[targetCompId]?.parentId, listShellId)) {
          return { targetId: targetCompId, before: false };
        }
        if (handoffSameId(targetCompId, listShellId)) {
          const shellChildren = getChildrenIds(listShellId);
          if (!shellChildren.length) return null;
          return {
            targetId: shellChildren[shellChildren.length - 1],
            before: false,
          };
        }
        return null;
      }

      function handoffInsertDragIntoList(listShellId, dragId, insertSpec) {
        if (handoffIsListChildGroupingBundle(listShellId)) {
          const parentShell = componentDetails[listShellId]?.parentId;
          if (parentShell && handoffIsListShell(parentShell)) {
            listShellId = parentShell;
          } else {
            showSnackbar("Não é possível colocar grouping dentro de grouping.");
            return false;
          }
        }
        ensureComponentDetails(listShellId);
        ensureComponentDetails(dragId);
        handoffPushUndoState();
        if (
          handoffIsListShell(listShellId) &&
          handoffIsGroupingBundle(dragId) &&
          handoffGetLooseChildIdsUnderListShell(listShellId).length > 0
        ) {
          handoffWrapLooseChildrenInSubGrouping(listShellId);
        }
        const formerDragParent = componentDetails[dragId].parentId;
        handoffSnapshotPreGroupGlobalIndex(dragId);
        componentDetails[dragId].parentId = listShellId;
        let siblings = getChildrenIds(listShellId).filter(
          (id) => !handoffSameId(id, dragId)
        );
        if (
          insertSpec &&
          insertSpec.targetId &&
          !handoffSameId(insertSpec.targetId, dragId) &&
          handoffSameId(componentDetails[insertSpec.targetId]?.parentId, listShellId)
        ) {
          const at = siblings.findIndex((id) =>
            handoffSameId(id, insertSpec.targetId)
          );
          if (at >= 0) {
            const insertAt = insertSpec.before ? at : at + 1;
            siblings.splice(insertAt, 0, dragId);
          } else {
            siblings.push(dragId);
          }
        } else {
          siblings.push(dragId);
        }
        handoffSetSiblingOrderUnderParent(listShellId, siblings);
        expandedContainerIds.add(listShellId);
        if (
          formerDragParent != null &&
          formerDragParent !== "" &&
          !handoffSameId(formerDragParent, listShellId)
        ) {
          handoffPruneEmptyGroupings(String(formerDragParent));
        }
        handoffFlattenMisnestedGroupingBundles();
        handoffSyncSortYToGlobalDfsOrder();
        return true;
      }

      function handoffApplyGroupingDrop(targetCompId, dragId, dropHint) {
        if (
          !targetCompId ||
          !dragId ||
          handoffSameId(targetCompId, dragId) ||
          isDescendant(targetCompId, dragId)
        ) {
          return;
        }
        ensureComponentDetails(targetCompId);
        ensureComponentDetails(dragId);

        const listShellId = handoffResolveListShellForInsert(targetCompId);
        const shellIsList = handoffIsListShell(listShellId);
        const targetHasChildren = getChildrenIds(targetCompId).length > 0;
        const listHasChildren =
          shellIsList && getChildrenIds(listShellId).length > 0;

        if (!targetHasChildren && !listHasChildren) {
          handoffPushUndoState();
          const containerId = handoffCreateManualContainerAtTarget(targetCompId);
          const formerDragParent = componentDetails[dragId].parentId;
          handoffSnapshotPreGroupGlobalIndex(targetCompId);
          handoffSnapshotPreGroupGlobalIndex(dragId);
          componentDetails[targetCompId].parentId = containerId;
          componentDetails[dragId].parentId = containerId;
          handoffSetSiblingOrderUnderParent(containerId, [targetCompId, dragId]);
          expandedContainerIds.add(containerId);
          if (formerDragParent != null && formerDragParent !== "") {
            handoffPruneEmptyGroupings(String(formerDragParent));
          }
          handoffSyncSortYToGlobalDfsOrder();
          return;
        }

        if (
          handoffIsGroupingBundle(dragId) &&
          handoffIsListChildGroupingBundle(targetCompId) &&
          shellIsList
        ) {
          const insertSpec =
            dropHint && dropHint.targetId
              ? handoffBuildListInsertSpec(listShellId, targetCompId, dropHint)
              : { targetId: targetCompId, before: false };
          handoffInsertDragIntoList(listShellId, dragId, insertSpec);
          return;
        }

        if (shellIsList) {
          const insertSpec = handoffBuildListInsertSpec(
            listShellId,
            targetCompId,
            dropHint
          );
          handoffInsertDragIntoList(listShellId, dragId, insertSpec);
          return;
        }

        if (handoffIsGroupingBundle(dragId) && handoffIsGroupingBundle(targetCompId)) {
          showSnackbar("Não é possível colocar grouping dentro de grouping.");
          return;
        }
        handoffInsertDragIntoList(targetCompId, dragId, null);
      }

      function handoffGroupedChildTypeLabel(entryId, childComp) {
        const nestCount = getChildrenIds(entryId).length;
        if (nestCount > 0 && isPresetGroupingComp(childComp)) {
          return childComp.type || "Grouping";
        }
        if (nestCount > 0 && isManualListOrGroupingContainer(entryId)) {
          if (handoffIsListShell(entryId)) {
            const ct = componentDetails[entryId].containerType;
            if (!ct) return "Change";
            if (ct === "Grouping") return "Grouping";
            if (ct === "Ordered list") return "Ordered list";
            return "Lists";
          }
          return "Grouping";
        }
        return childComp.type || "Component";
      }

      /**
       * Converte posição global digitada em posição local entre irmãos do grouping preset.
       * Ex.: Heading=01, Text=02, Button=03 — filho que digita 03 vai para local 2 (troca com Button).
       */
      function mapPresetChildGlobalToSiblingLocal(
        parentId,
        compId,
        targetGlobal,
        globalIndexMap
      ) {
        const siblings = getChildrenIds(parentId);
        if (!siblings.length) return 1;
        const withGlobal = siblings.map((id, i) => ({
          id,
          globalIdx: handoffLookupGlobalIndex(globalIndexMap, id),
          localOneBased: i + 1,
        }));
        const exactSibling = withGlobal.find(
          (s) =>
            s.globalIdx === targetGlobal && !handoffSameId(s.id, compId)
        );
        if (exactSibling) return exactSibling.localOneBased;
        let localPos = 1;
        for (let gi = 0; gi < withGlobal.length; gi++) {
          const s = withGlobal[gi];
          if (handoffSameId(s.id, compId)) continue;
          if (s.globalIdx < targetGlobal) localPos++;
        }
        return Math.min(Math.max(localPos, 1), siblings.length);
      }

      /** Reordena filho apenas entre irmãos do mesmo pai (1-based). */
      function reorderComponentWithinParent(compId, oneBasedLocal) {
        ensureComponentDetails(compId);
        const parentId = componentDetails[compId].parentId;
        if (parentId == null || parentId === "") return false;
        handoffEnsureSiblingOrderSeeded();
        const siblings = getChildrenIds(parentId);
        let from = -1;
        for (let i = 0; i < siblings.length; i++) {
          if (handoffSameId(siblings[i], compId)) {
            from = i;
            break;
          }
        }
        if (from === -1) return false;
        const to = Math.min(Math.max(oneBasedLocal - 1, 0), siblings.length - 1);
        if (to === from) return true;
        const ids = siblings.slice();
        const moved = ids.splice(from, 1)[0];
        ids.splice(to, 0, moved);
        handoffSetSiblingOrderUnderParent(parentId, ids);
        clearCustomIndexForSiblingsForest(parentId);
        handoffSyncSortYToGlobalDfsOrder();
        return true;
      }

      function applyHandoffRegistryDefaults(comp) {
        if (!comp || !comp.id || typeof WELLHUB_COMPONENT_REGISTRY === "undefined") return;
        ensureComponentDetails(comp.id);
        const details = componentDetails[comp.id];
        if (isPresetGroupingComp(comp)) {
          comp.presetGrouping = true;
          details.containerType = "Grouping";
          details.presetGroupingParent = true;
        }
        if (comp.manualInternalReadContainer) {
          comp.presetGrouping = true;
          details.containerType = "Grouping";
          details.presetGroupingParent = true;
          details.customOnlyMode = true;
          details.allowStandardMode = false;
          details.mode = "custom";
          details.guidelinesLocked = false;
        }
        if (comp.presetGroupingChild) {
          details.presetGroupingChild = true;
        }
        const rules = WELLHUB_COMPONENT_REGISTRY.getHandoffFieldRules(comp.type);
        if (!rules) return;
        details.customOnlyMode = !rules.readExactlyAsInterface;
        details.allowStandardMode = !!rules.readExactlyAsInterface;
        details.guidelinesLocked = !!rules.guidelinesLocked;
        details.requiredFields = {
          labelAlternative: rules.ariaLabel === "required",
          supplementary: rules.supplemental === "required",
          feedback: rules.feedback === "required",
        };
        details.mode = rules.readExactlyAsInterface ? "standard" : "custom";
        details.registryRules = rules;
        if (rules.guidelinesForDev && String(rules.guidelinesForDev).trim()) {
          if (!details.customData) details.customData = {};
          if (
            !details.customData.designerGuidance ||
            typeof details.customData.designerGuidance !== "object"
          ) {
            details.customData.designerGuidance = {
              enabled: true,
              text: String(rules.guidelinesForDev),
            };
          } else if (
            rules.guidelinesLocked ||
            !String(details.customData.designerGuidance.text || "").trim()
          ) {
            details.customData.designerGuidance.enabled = true;
            details.customData.designerGuidance.text = String(rules.guidelinesForDev);
          }
        }
      }

      function materializePresetGroupingChildren(components) {
        if (!Array.isArray(components)) return;
        components.forEach(function (parent) {
          if (!isPresetGroupingComp(parent)) return;
          if (!Array.isArray(parent.listItems) || !parent.listItems.length) return;
          const parentId = handoffCanonicalCompId(parent.id);
          parent.presetGrouping = true;
          ensureComponentDetails(parentId);
          componentDetails[parentId].containerType = "Grouping";
          componentDetails[parentId].presetGroupingParent = true;
          parent.listItems.forEach(function (item) {
            if (!item || item.id == null) return;
            const childId = item.id;
            let childComp = components.find(function (c) {
              return handoffSameId(c.id, childId);
            });
            if (childComp) {
              childComp.type = normalizeComponentType(item.type || childComp.type);
              childComp.name = item.name || childComp.name;
              childComp.presetGroupingChild = true;
              if (item._sortY != null) {
                childComp._sortY = item._sortY;
                childComp._scanSortY =
                  item._scanSortY != null ? item._scanSortY : item._sortY;
                childComp._sortX = item._sortX != null ? item._sortX : 0;
                childComp._scanSortX =
                  item._scanSortX != null ? item._scanSortX : childComp._sortX;
              }
            } else {
              childComp = {
                id: childId,
                name: item.name || "",
                type: normalizeComponentType(item.type || "Component"),
                presetGroupingChild: true,
                _sortY: item._sortY != null ? item._sortY : 0,
                _sortX: item._sortX != null ? item._sortX : 0,
              };
              if (item._scanSortY != null) {
                childComp._scanSortY = item._scanSortY;
                childComp._scanSortX = item._scanSortX != null ? item._scanSortX : 0;
              } else if (item._sortY != null) {
                childComp._scanSortY = item._sortY;
                childComp._scanSortX = item._sortX != null ? item._sortX : 0;
              }
              components.push(childComp);
            }
            ensureComponentDetails(childId);
            componentDetails[childId].parentId = parentId;
            componentDetails[childId].presetGroupingChild = true;
          });
        });
      }

      /** Scan sort key; synthetic group-* containers derive from earliest child on canvas. */
      function handoffGetNodeScanSortKey(node) {
        if (!node) return { y: 0, x: 0 };
        if (node._scanSortY != null) {
          return {
            y: node._scanSortY,
            x: node._scanSortX != null ? node._scanSortX : 0,
          };
        }
        if (String(node.id).indexOf("group-") === 0) {
          let minY = null;
          let minX = 0;
          getChildrenIds(node.id).forEach(function (cid) {
            const child = getCompById(cid);
            if (!child || child._scanSortY == null) return;
            const cx = child._scanSortX != null ? child._scanSortX : 0;
            if (
              minY == null ||
              child._scanSortY < minY ||
              (child._scanSortY === minY && cx < minX)
            ) {
              minY = child._scanSortY;
              minX = cx;
            }
          });
          if (minY != null) return { y: minY, x: minX };
        }
        return {
          y: node._sortY != null ? node._sortY : 0,
          x: node._sortX != null ? node._sortX : 0,
        };
      }

      function handoffCompareScanOrCurrentSort(a, b) {
        const ka = handoffGetNodeScanSortKey(a);
        const kb = handoffGetNodeScanSortKey(b);
        if (ka.y !== kb.y) return ka.y - kb.y;
        if (ka.x !== kb.x) return ka.x - kb.x;
        return String(a.id).localeCompare(String(b.id));
      }

      /** Manual group-* shells and preset scan groupings are removed when empty. */
      function handoffIsRemovableGroupingWhenEmpty(compId) {
        const comp = getCompById(compId);
        if (!comp) return false;
        if (isPresetGroupingComp(comp)) return true;
        return handoffIsSyntheticGroupingContainer(compId);
      }

      function handoffRemoveGroupingNode(compId) {
        const sid = String(compId);
        const orphans = getChildrenIds(sid);
        const grandParent = componentDetails[sid]?.parentId;
        if (orphans.length > 0) {
          orphans.forEach(function (oid) {
            ensureComponentDetails(oid);
            componentDetails[oid].parentId =
              grandParent != null && grandParent !== "" ? grandParent : null;
          });
          if (grandParent != null && grandParent !== "") {
            handoffSetSiblingOrderUnderParent(grandParent, getChildrenIds(grandParent));
          } else {
            handoffSetSiblingOrderUnderParent(
              null,
              getOrderedRootComps().map(function (x) {
                return x.id;
              })
            );
          }
        }
        expandedContainerIds.delete(sid);
        delete componentDetails[sid];
        detectedComponents = detectedComponents.filter(
          (c) => !handoffSameId(c.id, sid)
        );
      }

      /** Removes empty grouping cards; bubbles up nested empty containers. */
      function handoffPruneEmptyGroupings(startParentId) {
        let pid =
          startParentId != null && startParentId !== ""
            ? String(startParentId)
            : null;
        while (pid) {
          if (getChildrenIds(pid).length > 0) break;
          if (handoffIsRemovableGroupingWhenEmpty(pid)) {
            const grandParent = componentDetails[pid]?.parentId;
            handoffRemoveGroupingNode(pid);
            pid =
              grandParent != null && grandParent !== ""
                ? String(grandParent)
                : null;
          } else {
            const det = componentDetails[pid];
            if (det && det.containerType) det.containerType = null;
            break;
          }
        }
      }

      function handoffGetSiblingComps(parentId) {
        if (parentId == null || parentId === "") {
          return detectedComponents.filter((c) => {
            const p = componentDetails[c.id]?.parentId;
            return p == null || p === "";
          });
        }
        return detectedComponents.filter((c) =>
          handoffSameId(componentDetails[c.id]?.parentId, parentId)
        );
      }

      function handoffRebuildOrderFromScanPositions() {
        function assignSiblingOrder(parentId) {
          const children = handoffGetSiblingComps(parentId);
          children.sort(handoffCompareScanOrCurrentSort);
          children.forEach((c, i) => {
            c._sortY = i;
            c._sortX = 0;
            assignSiblingOrder(c.id);
          });
        }
        assignSiblingOrder(null);
        handoffSyncSortYToGlobalDfsOrder();
      }

      function handoffClearGroupingOrderState(compId) {
        const det = componentDetails[compId];
        if (!det) return;
        if (det.customIndex != null) delete det.customIndex;
        if (det.siblingOrder != null) delete det.siblingOrder;
      }

      /** Guarda índice global (1-based) antes de acoplar ao grouping. */
      function handoffSnapshotPreGroupGlobalIndex(compId) {
        const canon = handoffCanonicalCompId(compId);
        if (canon == null) return;
        ensureComponentDetails(canon);
        const pid = componentDetails[canon].parentId;
        if (pid != null && pid !== "") return;
        if (isScreenTitleCompId(canon)) return;
        const globalIndexMap = getGlobalIndexMap();
        componentDetails[canon].preGroupGlobalIndex = handoffLookupGlobalIndex(
          globalIndexMap,
          canon
        );
      }

      function handoffRestoreComponentToPreGroupGlobalIndex(
        compId,
        targetGlobalOneBased
      ) {
        const node = getCompById(compId);
        if (!node) return;
        handoffClearGroupingOrderState(compId);
        const target = Math.max(1, targetGlobalOneBased | 0);
        const others = handoffGetSiblingComps(null).filter(
          (c) => !handoffSameId(c.id, compId) && !isScreenTitleComp(c)
        );
        others.sort(handoffCompareScanOrCurrentSort);
        const insertAt = Math.min(target - 1, others.length);
        let sortY;
        if (others.length === 0) {
          sortY = node._scanSortY != null ? node._scanSortY : 0;
        } else if (insertAt <= 0) {
          sortY = handoffGetNodeScanSortKey(others[0]).y - 1;
        } else if (insertAt >= others.length) {
          sortY =
            handoffGetNodeScanSortKey(others[others.length - 1]).y + 1;
        } else {
          const beforeY = handoffGetNodeScanSortKey(others[insertAt - 1]).y;
          const afterY = handoffGetNodeScanSortKey(others[insertAt]).y;
          sortY = beforeY < afterY - 1 ? beforeY + 1 : beforeY + 0.5;
        }
        node._scanSortY = sortY;
        node._sortY = sortY;
        node._sortX = node._scanSortX != null ? node._scanSortX : 0;
      }

      function handoffRestoreComponentToScanPosition(compId) {
        const node = getCompById(compId);
        handoffClearGroupingOrderState(compId);
        if (!node || node._scanSortY == null) return;
        node._sortY = node._scanSortY;
        node._sortX = node._scanSortX != null ? node._scanSortX : 0;
      }

      function handoffReleaseFromGroup(compId) {
        const canon = handoffCanonicalCompId(compId);
        if (canon == null) return false;
        ensureComponentDetails(canon);
        const pid = componentDetails[canon].parentId;
        if (pid == null || pid === "") return false;
        const pidStr = String(pid);
        const preIdx = componentDetails[canon].preGroupGlobalIndex;
        handoffPushUndoState();
        componentDetails[canon].parentId = null;
        if (preIdx != null && preIdx > 0) {
          handoffRestoreComponentToPreGroupGlobalIndex(canon, preIdx);
          delete componentDetails[canon].preGroupGlobalIndex;
        } else {
          handoffRestoreComponentToScanPosition(canon);
        }
        handoffPruneEmptyGroupings(pidStr);
        handoffRebuildOrderFromScanPositions();
        return true;
      }

      function handoffDecoupleFromGroup(compId) {
        return handoffReleaseFromGroup(compId);
      }

      function handoffDeleteComponentSubtree(compId) {
        const canon = handoffCanonicalCompId(compId);
        if (canon == null) return 0;
        const formerParent = componentDetails[canon]?.parentId;
        const idsToRemove = new Set();
        function collectIds(id) {
          const sid = String(id);
          if (idsToRemove.has(sid)) return;
          idsToRemove.add(sid);
          getChildrenIds(sid).forEach(collectIds);
        }
        collectIds(canon);
        idsToRemove.forEach((id) => {
          expandedContainerIds.delete(id);
          delete componentDetails[id];
        });
        detectedComponents = detectedComponents.filter(
          (c) => !idsToRemove.has(String(c.id))
        );
        if (formerParent != null && formerParent !== "") {
          handoffPruneEmptyGroupings(String(formerParent));
        }
        handoffRebuildOrderFromScanPositions();
        return idsToRemove.size;
      }

      function handoffGetResultsScrollPos() {
        const scrollableEl = document.querySelector(".content.content-results-component");
        return scrollableEl ? scrollableEl.scrollTop : 0;
      }

      var handoffActionTooltipEl = null;
      var handoffActionTooltipScrollHandler = null;

      function handoffEnsureActionTooltipEl() {
        if (handoffActionTooltipEl) return handoffActionTooltipEl;
        const wrap = document.createElement("div");
        wrap.className = "handoff-action-tooltip";
        wrap.setAttribute("role", "tooltip");
        const bubble = document.createElement("div");
        bubble.className = "handoff-action-tooltip__bubble";
        wrap.appendChild(bubble);
        document.body.appendChild(wrap);
        handoffActionTooltipEl = wrap;
        return wrap;
      }

      function handoffPositionActionTooltip(anchor) {
        const tip = handoffActionTooltipEl;
        if (!tip || !anchor) return;
        const rect = anchor.getBoundingClientRect();
        const tipWidth = tip.offsetWidth;
        const tipHeight = tip.offsetHeight;
        let left = rect.left + rect.width / 2 - tipWidth / 2;
        const top = rect.top - tipHeight - 6;
        const viewportWidth =
          typeof window !== "undefined" ? window.innerWidth : 420;
        left = Math.max(8, Math.min(left, viewportWidth - tipWidth - 8));
        tip.style.left = left + "px";
        tip.style.top = Math.max(8, top) + "px";
      }

      function handoffHideActionTooltip() {
        if (handoffActionTooltipEl) {
          handoffActionTooltipEl.classList.remove("is-visible");
          handoffActionTooltipEl.style.visibility = "";
        }
        if (handoffActionTooltipScrollHandler) {
          window.removeEventListener("scroll", handoffActionTooltipScrollHandler, true);
          handoffActionTooltipScrollHandler = null;
        }
      }

      function handoffShowActionTooltip(anchor, label) {
        const tip = handoffEnsureActionTooltipEl();
        tip.querySelector(".handoff-action-tooltip__bubble").textContent = label;
        tip.style.visibility = "hidden";
        tip.classList.add("is-visible");
        requestAnimationFrame(() => {
          handoffPositionActionTooltip(anchor);
          tip.style.visibility = "visible";
        });
        if (handoffActionTooltipScrollHandler) {
          window.removeEventListener("scroll", handoffActionTooltipScrollHandler, true);

        handoffActionTooltipScrollHandler = handoffHideActionTooltip;

      function handoffMountDecoupleButton(compId) {

      function handoffMountDeleteGroupedChildButton(compId) {

            onConfirm: () => {
              const scrollPos = handoffGetResultsScrollPos();
              handoffPushUndoState();
              const deletedCount = handoffDeleteComponentSubtree(compId);
              if (!deletedCount) {
                handoffUndoStack.pop();
                return;
              }
              saveGroupingToStorage();
              renderResultsComponent(scrollPos);
              showSnackbar(
                deletedCount === 1
                  ? "Component deleted"
                  : deletedCount + " components deleted"
              );

      function handoffCompareComps(a, b) {
        const aScreen = isScreenTitleComp(a);
        const bScreen = isScreenTitleComp(b);
        if (aScreen && !bScreen) return -1;
        if (!aScreen && bScreen) return 1;
        const ya =
          a._sortY != null
            ? a._sortY
            : a._scanSortY != null
              ? a._scanSortY
              : 0;
        const yb =
          b._sortY != null
            ? b._sortY
            : b._scanSortY != null
              ? b._scanSortY
              : 0;
        if (ya !== yb) return ya - yb;
        const xa = a._sortX != null ? a._sortX : a._scanSortX != null ? a._scanSortX : 0;
        const xb = b._sortX != null ? b._sortX : b._scanSortX != null ? b._scanSortX : 0;
        if (xa !== xb) return xa - xb;
        return String(a.id).localeCompare(String(b.id));
      }

      function getChildrenIds(parentId) {
        return handoffGetChildCompsForParent(parentId)
          .sort(handoffCompareSiblingOrder)
          .map((c) => c.id);
      }

      function buildFlattenedOrder() {
        const order = [];
        function visit(parentId) {
          const children = handoffGetChildCompsForParent(parentId);
          const sorted = children.slice().sort(handoffCompareSiblingOrder);
          for (const c of sorted) {
            order.push(c.id);
            visit(c.id);
          }
        }
        visit(null);
        return order;
      }

      function getGlobalIndexMap() {
        dedupeScreenTitleComps();
        handoffEnsureSiblingOrderSeeded();
        const order = buildFlattenedOrder();
        const map = new Map();
        let nextIndex = 1;
        let numberedIndex = 0;
        order.forEach(function (id) {
          const comp = getCompById(id);
          const key = handoffCanonicalCompId(id);
          if (isScreenTitleComp(comp)) {
            map.set(key, 0);
            if (comp) {
              comp._sortY = -1;
              comp._sortX = 0;
            }
          } else {
            map.set(key, nextIndex);
            if (comp) {
              comp._sortY = numberedIndex;
              comp._sortX = 0;
            }
            nextIndex += 1;
            numberedIndex += 1;
          }
        });
        return map;
      }

      function handoffSyncSortYToGlobalDfsOrder() {
        getGlobalIndexMap();
      }

      function handoffEscapeAttr(s) {
        const x = String(s);
        if (typeof CSS !== "undefined" && CSS.escape) return CSS.escape(x);
        return x.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
      }

      function handoffEaseInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      /** scrollTop that vertically centers `row` inside scrollable `container` */
      function handoffComputeScrollCenterRow(container, row) {
        const c = container.getBoundingClientRect();
        const r = row.getBoundingClientRect();
        let st = container.scrollTop;
        st += (r.top + r.bottom) / 2 - (c.top + c.bottom) / 2;
        const maxS = Math.max(0, container.scrollHeight - container.clientHeight);
        return Math.max(0, Math.min(st, maxS));
      }

      /**
       * FLIP + scroll: same duration, ease-in-out — scroll acompanha o card devagar.
       */
      function handoffRunReorderFlipAnimation(scrollableEl, rowId, firstRect) {
        if (!scrollableEl || !firstRect) return;
        const durationMs = 1380;
        const sel = '[data-handoff-row-id="' + handoffEscapeAttr(rowId) + '"]';
        const row = scrollableEl.querySelector(sel);
        if (!row) return;

        const scrollStart = scrollableEl.scrollTop;
        const scrollEnd = handoffComputeScrollCenterRow(scrollableEl, row);

        const last = row.getBoundingClientRect();
        const dx = firstRect.left - last.left;
        const dy = firstRect.top - last.top;
        const hasMove = Math.abs(dx) >= 0.5 || Math.abs(dy) >= 0.5;

        row.classList.add("handoff-reorder-flash");

        let scrollRafId = 0;
        let t0Scroll = null;

        function runScrollSync(now) {
          if (t0Scroll === null) t0Scroll = now;
          var elapsed = Math.min(durationMs, now - t0Scroll);
          var t = elapsed / durationMs;
          var e = handoffEaseInOutCubic(t);
          scrollableEl.scrollTop = scrollStart + (scrollEnd - scrollStart) * e;
          if (t < 1) scrollRafId = requestAnimationFrame(runScrollSync);
        }

        function startScrollSync() {
          t0Scroll = null;
          scrollRafId = requestAnimationFrame(runScrollSync);
        }

        var cleaned = false;
        function cleanup() {
          if (cleaned) return;
          cleaned = true;
          if (scrollRafId) cancelAnimationFrame(scrollRafId);
          scrollableEl.scrollTop = scrollEnd;
          row.classList.remove("handoff-reorder-flash");
          row.style.removeProperty("transform");
          row.style.removeProperty("transition");
          row.style.removeProperty("will-change");
        }

        if (hasMove) {
          row.style.willChange = "transform";
          row.style.transform = "translate3d(" + dx + "px, " + dy + "px, 0)";
          row.style.transition = "none";
          void row.offsetHeight;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              row.style.transition =
                "transform " +
                durationMs +
                "ms cubic-bezier(0.33, 0.72, 0.22, 1)";
              row.style.transform = "translate3d(0, 0, 0)";
              startScrollSync();
            });
          });
        } else {
          startScrollSync();
        }

        setTimeout(cleanup, durationMs + 120);
      }

      function getSiblingIdsForParent(parentId) {
        if (parentId == null) {
          return getOrderedRootComps().map((c) => c.id);
        }
        return getChildrenIds(parentId);
      }

      /**
       * 1-based position in the global pre-order DFS list. Updates parentId / sibling _sortY as needed.
       */
      function handoffNearestSiblingForReorder(compId, anchorId) {
        const compParent =
          componentDetails[compId] && componentDetails[compId].parentId != null
            ? componentDetails[compId].parentId
            : null;
        let cur = anchorId;
        while (cur != null && cur !== "") {
          const p =
            componentDetails[cur] && componentDetails[cur].parentId != null
              ? componentDetails[cur].parentId
              : null;
          if (handoffSameId(p, compParent)) return cur;
          if (handoffIsGroupingBundle(compId) && p != null && handoffIsListShell(p)) {
            return cur;
          }
          cur = p;
        }
        return anchorId;
      }

      function handoffResolveReorderParentId(compId, anchorParent) {
        if (!handoffIsGroupingBundle(compId)) return anchorParent;
        if (anchorParent == null || anchorParent === "") return anchorParent;
        if (handoffIsListShell(anchorParent)) return anchorParent;
        if (handoffIsListChildGroupingBundle(anchorParent)) {
          const listShell = componentDetails[anchorParent].parentId;
          return listShell != null && listShell !== "" ? listShell : anchorParent;
        }
        return anchorParent;
      }

      function reorderComponentToGlobalPosition(compId, oneBasedGlobal) {
        ensureComponentDetails(compId);
        if (isScreenTitleCompId(compId)) return false;
        if (oneBasedGlobal <= 0) return false;
        if (isPresetGroupingChild(compId)) return false;
        handoffEnsureSiblingOrderSeeded();
        const flat = buildNumberedFlattenedOrder();
        let from = -1;
        for (let fi = 0; fi < flat.length; fi++) {
          if (handoffSameId(flat[fi], compId)) {
            from = fi;
            break;
          }
        }
        if (from === -1) return false;
        let to = Math.min(Math.max(oneBasedGlobal - 1, 0), flat.length - 1);
        if (to === from) {
          if (componentDetails[compId] && componentDetails[compId].customIndex != null) {
            delete componentDetails[compId].customIndex;
          }
          return true;
        }

        const subtree = handoffCollectSubtreeIdSet(compId);
        let anchorId = flat[to];
        if (anchorId && isDescendant(compId, anchorId)) {
          if (to > from) {
            let lastInSubtree = from;
            for (let i = 0; i < flat.length; i++) {
              if (subtree.has(handoffCanonicalCompId(flat[i]))) {
                lastInSubtree = i;
              }
            }
            to = Math.min(lastInSubtree + 1, flat.length - 1);
          } else {
            let resolved = from;
            for (let i = Math.min(to, from - 1); i >= 0; i--) {
              if (!subtree.has(handoffCanonicalCompId(flat[i]))) {
                to = i;
                resolved = i;
                break;
              }
            }
            if (resolved === from) return false;
          }
          anchorId = flat[to];
        }

        if (to === from) return false;
        if (!anchorId || handoffSameId(anchorId, compId)) return false;
        if (isDescendant(compId, anchorId)) return false;

        anchorId = handoffNearestSiblingForReorder(compId, anchorId);
        let anchorParent =
          (componentDetails[anchorId] && componentDetails[anchorId].parentId) || null;
        anchorParent = handoffResolveReorderParentId(compId, anchorParent);
        if (anchorParent && isDescendant(compId, anchorParent)) return false;

        const oldParent = componentDetails[compId].parentId || null;
        componentDetails[compId].parentId = anchorParent;

        const ids = getSiblingIdsForParent(anchorParent).filter(
          (id) => !handoffSameId(id, compId)
        );
        let ap = -1;
        for (let ai = 0; ai < ids.length; ai++) {
          if (handoffSameId(ids[ai], anchorId)) {
            ap = ai;
            break;
          }
        }
        if (ap === -1) {
          componentDetails[compId].parentId = oldParent;
          return false;
        }
        const insertAt = to < from ? ap : ap + 1;
        ids.splice(insertAt, 0, compId);
        handoffSetSiblingOrderUnderParent(anchorParent, ids);

        if (oldParent !== anchorParent) {
          handoffSetSiblingOrderUnderParent(
            oldParent,
            getSiblingIdsForParent(oldParent)
          );
        }

        clearCustomIndexForSiblingsForest(oldParent);
        clearCustomIndexForSiblingsForest(anchorParent);
        handoffSyncSortYToGlobalDfsOrder();
        return true;
      }

      function getCompById(id) {
        return detectedComponents.find((c) => handoffSameId(c.id, id));
      }

      function getOrderedRootComps() {
        return detectedComponents
          .filter((c) => !componentDetails[c.id]?.parentId)
          .sort(handoffCompareSiblingOrder);
      }

      function clearCustomIndexInSubtree(rootId) {
        function walk(cid) {
          const d = componentDetails[cid];
          if (d && d.customIndex != null) delete d.customIndex;
          getChildrenIds(cid).forEach(walk);
        }
        walk(rootId);
      }

      function clearCustomIndexForSiblingsForest(parentId) {
        const rootIds =
          parentId == null
            ? getOrderedRootComps().map((c) => c.id)
            : getChildrenIds(parentId);
        rootIds.forEach((rid) => clearCustomIndexInSubtree(rid));
      }

      function isDescendant(ancestorId, descendantId) {
        let id = descendantId;
        while (id != null && id !== "") {
          const p = componentDetails[id]?.parentId;
          if (p != null && handoffSameId(p, ancestorId)) return true;
          id = p;
        }
        return false;
      }

      function handoffCollectSubtreeIdSet(rootId) {
        const set = new Set();
        function walk(id) {
          const sid = handoffCanonicalCompId(id);
          if (!sid || set.has(sid)) return;
          set.add(sid);
          getChildrenIds(id).forEach(walk);
        }
        walk(rootId);
        return set;
      }

      /**
       * Se o índice alvo cai dentro da própria subárvore (ex.: mover pai para número de um filho),
       * remapeia para a borda do bloco — mantém o bloco pai+filhos coeso na reordenação global.
       */
      function handoffResolveReorderTargetIndex(compId, flat, from, to) {
        if (!flat.length) return to;
        let anchorId = flat[to];
        if (!anchorId || handoffSameId(anchorId, compId)) return to;
        if (!isDescendant(compId, anchorId)) return to;

        const subtree = handoffCollectSubtreeIdSet(compId);
        let lastInSubtree = from;
        for (let i = 0; i < flat.length; i++) {
          if (subtree.has(handoffCanonicalCompId(flat[i]))) {
            lastInSubtree = i;
          }
        }

        if (to > from) {
          return Math.min(lastInSubtree + 1, flat.length - 1);
        }
        for (let i = from - 1; i >= 0; i--) {
          if (!subtree.has(handoffCanonicalCompId(flat[i]))) {
            return i;
          }
        }
        return from;
      }

      function buildAccessibilityPayload() {
        const compMap = {};
        detectedComponents.forEach((c) => {
          compMap[c.id] = c;
        });
        const globalIndexMap = getGlobalIndexMap();
        const buildFlat = (parentId) => {
          const result = [];
          detectedComponents.forEach((c) => {
            const details = componentDetails[c.id] || {};
            const pid = details.parentId;
            if ((parentId == null && !pid) || pid === parentId) {
              const children = getChildrenIds(c.id);
              const childComps = children
                .map((id) => compMap[id])
                .filter(Boolean);
              const atomicSimple =
                typeof WELLHUB_COMPONENT_REGISTRY !== "undefined" &&
                WELLHUB_COMPONENT_REGISTRY.isSimpleAtomicHandoffType(c.type);
              const embedChildrenAsList = children.length > 0 && !atomicSimple;
              result.push({
                id: c.id,
                name: c.name,
                type: embedChildrenAsList
                  ? details.containerType || "List"
                  : c.type,
                status: (details && details.status) || "exact",
                mode: details.mode || "standard",
                standardData: details.standardData || {},
                customData: details.customData || {},
                parentId: details.parentId || null,
                containerType: details.containerType || null,
                globalIndex: handoffLookupGlobalIndex(globalIndexMap, c.id),
                listItems: embedChildrenAsList
                  ? childComps
                      .map((ch) =>
                        handoffBuildAccessibilityListItem(
                          ch.id,
                          compMap,
                          globalIndexMap
                        )
                      )
                      .filter(Boolean)
                  : atomicSimple
                    ? undefined
                    : c.listItems
                      ? c.listItems.map((it) => {
                          const itDetails = it.id
                            ? componentDetails[it.id] || {}
                            : {};
                          return {
                            ...it,
                            globalIndex: it.id
                              ? handoffLookupGlobalIndex(globalIndexMap, it.id)
                              : undefined,
                            mode: itDetails.mode || "standard",
                            customData: itDetails.customData || {},
                          };
                        })
                      : undefined,
              });
            }
          });
          return result;
        };
        const components = buildFlat(null).sort(
          (a, b) => (a.globalIndex || 0) - (b.globalIndex || 0)
        );
        return { components, scanRootId: lastScanRootId };
      }

      function handoffValidateComponentFields(compId) {
        if (isScreenTitleCompId(compId)) return false;
        const details = componentDetails[compId];
        if (!details) return false;
        let hasError = false;
        const custom = details.customData || {};
        const modeChecks =
          details.mode === "custom"
            ? ["labelAlternative", "supplementary", "feedback"]
            : [];
        [...modeChecks, "designerGuidance"].forEach((key) => {
          const item = custom[key];
          if (item && typeof item === "object" && item.enabled && !item.text) {
            hasError = true;
          }
        });
        return hasError;
      }

      function handoffBuildDuplicateIndexIdSet() {
        const duplicateIndexIds = new Set();
        const comps = detectedComponents.filter(
          (c) => !componentDetails[c.id]?.parentId
        );
        const globalIndexMap = getGlobalIndexMap();
        const indexToIds = new Map();
        comps.forEach((c, idx) => {
          if (isScreenTitleComp(c)) return;
          const num = handoffLookupGlobalIndex(globalIndexMap, c.id);
          const key = String(num).padStart(2, "0");
          if (!indexToIds.has(key)) indexToIds.set(key, []);
          indexToIds.get(key).push(c.id);
        });
        indexToIds.forEach((ids) => {
          if (ids.length > 1) ids.forEach((id) => duplicateIndexIds.add(id));
        });
        return duplicateIndexIds;
      }

      function handoffComponentNeedsAttention(compId, duplicateIndexIds) {
        if (isScreenTitleCompId(compId)) {
          return !getScreenTitleText(compId).trim();
        }
        if (duplicateIndexIds && duplicateIndexIds.has(compId)) return true;
        if (handoffValidateComponentFields(compId)) return true;
        const details = componentDetails[compId];
        const childrenIds = getChildrenIds(compId);
        const hasChildren = childrenIds.length > 0;
        const needsChoice =
          handoffIsListShell(compId) && hasChildren && !(details && details.containerType);
        return needsChoice;
      }

      function handoffGetStatusForComponent(compId, duplicateIndexIds) {
        const dup =
          duplicateIndexIds != null
            ? duplicateIndexIds
            : handoffBuildDuplicateIndexIdSet();
        return handoffComponentNeedsAttention(compId, dup)
          ? "needs-review"
          : "exact";

          return String(

        const dg = comp.customData && comp.customData.designerGuidance;

      const LEGACY_TYPE_MAP = {

      function normalizeComponentType(type) {

      function normalizeScanComponentTypes(components) {
        if (!Array.isArray(components)) return [];
        return components.map((c) => {
          if (!c || typeof c !== "object") return c;
          const out = { ...c, type: normalizeComponentType(c.type) };
          if (out._sortY != null && out._scanSortY == null) {
            out._scanSortY = out._sortY;
            out._scanSortX = out._sortX != null ? out._sortX : 0;
          }
          if (Array.isArray(out.listItems)) {
            out.listItems = out.listItems.map((li) => {
              if (!li || typeof li !== "object") return li;
              const liOut = { ...li, type: normalizeComponentType(li.type) };
              if (liOut._sortY != null && liOut._scanSortY == null) {
                liOut._scanSortY = liOut._sortY;
                liOut._scanSortX = liOut._sortX != null ? liOut._sortX : 0;
              }
              return liOut;
            });
          }
          if (out.type && String(out.type).indexOf("• Grouping") >= 0) {
            out.presetGrouping = true;
          }
          if (
            typeof WELLHUB_COMPONENT_REGISTRY !== "undefined" &&
            WELLHUB_COMPONENT_REGISTRY.isSimpleAtomicHandoffType(out.type)
          ) {
            delete out.listItems;
          }
          return out;
        });
      }
