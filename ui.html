<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Accessibility Handoff</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap");

      @font-face {
        font-family: "NaN Holo Condensed";
        src: url("assets/fonts/NaNHoloCompressed-Bold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
      }

      :root {
        /* Dimensões do painel do plugin (Figma UI) */
        --plugin-ui-width: 420px;
        --plugin-ui-height: 600px;

        --background: #ffffff;
        --card: #ffffff;
        --muted: #f0ece4;
        --border: #ECECEC;
        --primary: #111827;
        --primary-foreground: #ffffff;
        --foreground: #12110f;
        --secondary: #6b5f4f;
        --accent: #57544d;
        --accent-hover: #FCFCFC;
        --destructive: #ca4808;
        --chart-3: #22c55e;
        --chart-4: #eab308;

        --surface-subtle: #faf9f6;
        --surface-hover: #f4f4f4;
        --surface-muted: #f9f9f9;
        --text-muted: #57544d;
        --overlay-scrim: rgba(0, 0, 0, 0.45);

        --icon-action-color: var(--secondary);
        --icon-action-hover-bg: var(--surface-hover);
        --icon-action-hover-color: var(--secondary);

        --font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --font-family-display: "Archivo", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;

        --text-xs: 10px;
        --text-sm: 12px;
        --text-base: 14px;
        --text-h2: 24px;
        --text-h3: 18px;

        --font-weight-normal: 400;
        --font-weight-medium: 500;
        --font-weight-semibold: 600;
        --font-weight-bold: 700;

        --radius: 10px;
        --radius-card: 12px;
        --radius-lg: 14px;
        --radius-tag: 999px;
        --radius-button: 999px;

        --elevation-sm: 0 1px 2px rgba(15, 23, 42, 0.08);
        --elevation-md: 0 8px 16px rgba(15, 23, 42, 0.14);
        --elevation-dropdown: 0 4px 12px rgba(0, 0, 0, 0.1);

        --snackbar-padding-y: 14px;
        --snackbar-padding-x: 20px;
        --snackbar-gap-below-header: 8px;
        --snackbar-fallback-top: 72px;

        --tooltip-bg: rgba(29, 29, 31, 0.89);
        --tooltip-text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: var(--plugin-ui-width);
        max-width: var(--plugin-ui-width);
        height: var(--plugin-ui-height);
        background: var(--background);
        font-family: var(--font-family);
        color: var(--foreground);
        overflow: hidden;
      }

      .app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .header {
        position: fixed;
        inset-inline: 0;
        top: 0;
        padding: 16px;
        background: var(--background);
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 20;
      }

      .header-static {
        position: static;
        box-shadow: none;
        margin-top: 24px;
        align-items: center;
      }

      .header-title {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: var(--font-weight-bold);
        letter-spacing: 0.02em;
      }

      .header-title-component,
      .header-title-results {
        font-size: 16px;
        font-weight: var(--font-weight-medium);
      }

      .header-title-archivo {
        font-family: var(--font-family-display);
      }

      .header-component-stack {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        width: 100%;
      }

      .header-component-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-width: 0;
      }

      .header-component-title-row .header-title {
        min-width: 0;
      }

      .header-actions-slot {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        min-height: 32px;
      }

      .handoff-actions-group {
        display: flex;
        gap: 8px;
        align-items: center;
        will-change: transform;
      }

      .handoff-actions-mount {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        min-height: 32px;
      }

      .handoff-actions-placeholder {
        flex-shrink: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .handoff-title-actions-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
      }

      .header-subtitle {
        font-family: var(--font-family);
        font-size: 14px;
        line-height: 18px;
        font-weight: var(--font-weight-normal);
        color: var(--secondary);
      }

      .header-subtitle .subtitle-emphasis {
        font-weight: var(--font-weight-semibold);
      }

      /* Home screens — onboarding + menu */
      @keyframes home-fade-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .home-screen {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .home-screen--animate .home-fade-item {
        animation: home-fade-in 0.42s ease both;
      }

      .home-screen--animate .home-fade-item[data-stagger="0"] {
        animation-delay: 0ms;
      }

      .home-screen--animate .home-fade-item[data-stagger="1"] {
        animation-delay: 70ms;
      }

      .home-screen--animate .home-fade-item[data-stagger="2"] {
        animation-delay: 140ms;
      }

      .home-screen--animate .home-fade-item[data-stagger="3"] {
        animation-delay: 210ms;
      }

      .home-screen--animate .home-fade-item[data-stagger="4"] {
        animation-delay: 280ms;
      }

      .hatha-title {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-weight: 800;
        line-height: 1;
        color: #2a2a2a;
        margin: 0;
      }

      .onboarding-screen {
        align-items: center;
        justify-content: center;
        padding: 24px 16px 24px;
      }

      .onboarding-screen__body {
        flex: 0 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        max-width: 355px;
        gap: 0;
      }

      .onboarding-screen__illustration {
        margin-top: 0;
        margin-bottom: 2px;
        flex-shrink: 0;
      }

      .onboarding-screen__illustration-img {
        display: block;
        width: 100%;
        max-width: 280px;
        height: auto;
        margin: 0 auto;
      }

      .onboarding-screen__body .hatha-title {
        margin-top: 0;
        margin-bottom: 2px;
        letter-spacing: -6px;
      }

      .onboarding-screen__copy {
        margin: 0 0 14px;
        font-family: var(--font-family);
        font-size: 14px;
        line-height: 18px;
        font-weight: 400;
        color: #6a6a6a;
        text-align: center;
      }

      .onboarding-screen__actions {
        width: 100%;
        display: flex;
        justify-content: center;
        margin-top: 0;
      }

      .onboarding-screen__start-btn {
        width: 180px;
        max-width: 100%;
        height: 48px;
        background: #d8385e;
        color: #ffffff;
        font-weight: var(--font-weight-normal);
      }

      .onboarding-screen__footer-wrap {
        width: 100%;
        max-width: 355px;
        flex-shrink: 0;
      }

      .tutorial-screen {
        align-items: center;
        justify-content: space-between;
        padding: 24px 16px 32px;
        overflow: hidden;
      }

      .tutorial-screen__body {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 388px;
        min-height: 0;
        overflow: hidden;
      }

      .tutorial-screen__content {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        gap: 16px;
        min-height: 0;
        overflow: hidden;
      }

      .tutorial-screen__content--centered {
        justify-content: center;
      }

      .tutorial-screen__image-wrap {
        box-sizing: border-box;
        width: 270px;
        height: auto;
        flex-shrink: 0;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .tutorial-screen__step {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        flex-shrink: 0;
        margin: 0;
        padding: 0 0 8px;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 10px;
        font-weight: 700;
        line-height: 12px;
        text-align: center;
      }

      .tutorial-screen__step-label {
        color: #c7c7c7;
      }

      .tutorial-screen__step-num {
        color: #1d1d1f;
        display: inline-flex;
        align-items: center;
      }

      .tutorial-screen__step-num-viewport {
        display: block;
        height: 12px;
        overflow: hidden;
        line-height: 12px;
      }

      .tutorial-screen__step-num-track {
        display: flex;
        flex-direction: column;
        will-change: transform;
        transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .tutorial-screen__step-num-value {
        display: block;
        height: 12px;
        line-height: 12px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .tutorial-screen__image {
        display: block;
        width: 270px;
        height: auto;
        object-fit: contain;
      }

      .tutorial-screen__image--sm {
        width: 200px;
      }

      .tutorial-screen__image--rounded {
        border-radius: 16px;
      }

      .tutorial-screen__icon-btn img {
        display: block;
        width: 16px;
        height: 16px;
      }

      .tutorial-screen__title {
        margin: 0;
        padding: 0 24px;
        font-family: "Archivo", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 24px;
        font-weight: var(--font-weight-semibold);
        line-height: 1.15;
        color: #1d1d1f;
        text-align: center;
      }

      .tutorial-screen__copy {
        margin: 0;
        padding: 0 16px;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 20px;
        font-weight: 400;
        color: #57544d;
        text-align: center;
      }

      .tutorial-screen__dots {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: auto;
        padding-top: 16px;
        list-style: none;
      }

      .tutorial-screen__dots-track {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .tutorial-screen__dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: #d9d9d9;
        flex-shrink: 0;
      }

      .tutorial-screen__dots-active {
        position: absolute;
        top: 0;
        left: 0;
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: #1d1d1f;
        transform: translateX(calc(var(--tutorial-dot-index, 0) * 14px));
        transition: transform 0.35s ease;
        pointer-events: none;
      }

      .tutorial-screen__footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
        width: 100%;
        max-width: 388px;
        margin-top: 24px;
        padding: 0 16px;
        flex-shrink: 0;
        gap: 12px;
      }

      .tutorial-screen__footer-slot {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .tutorial-screen__icon-btn {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 9999px;
        background: transparent;
        color: #1d1d1f;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      .tutorial-screen__icon-btn:hover {
        background: transparent;
      }

      .tutorial-screen__icon-btn svg {
        display: block;
        width: 16px;
        height: 16px;
      }

      .tutorial-screen__skip {
        min-width: 130px;
        height: 36px;
        border: none;
        border-radius: 9999px;
        background: #f5f5f5;
        color: #1d1d1f;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 20px;
        font-weight: 400;
        padding: 0 20px;
        cursor: pointer;
        opacity: 1;
        transform: scale(1);
        transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
          background 0.2s ease;
      }

      .tutorial-screen__skip.is-hidden {
        opacity: 0;
        transform: scale(0.94);
        pointer-events: none;
      }

      .tutorial-screen__skip:hover {
        background: #ececec;
      }

      .menu-screen {
        padding-bottom: 20px;
        align-items: center;
      }

      .menu-screen > .home-fade-item:first-child {
        width: 100%;
      }

      .menu-screen__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 16px 8px;
        flex-shrink: 0;
      }

      .menu-screen__title {
        margin-left: auto;
      }

      .menu-screen__content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin-top: 0;
        padding: 0 16px;
        width: 100%;
        min-height: 0;
      }

      .menu-screen__content > .home-fade-item {
        width: 100%;
      }

      .menu-screen__content > .home-fade-item + .home-fade-item {
        margin-top: 24px;
      }

      .menu-screen .scan-card {
        width: 100%;
        padding: 20px 16px;
        gap: 0;
      }

      .menu-screen .scan-icon {
        margin-bottom: 12px;
      }

      .menu-screen .scan-title {
        font-size: 16px;
        line-height: 20px;
        margin: 0 0 6px;
      }

      .menu-screen .scan-description {
        font-size: 14px;
        line-height: 18px;
        margin: 0;
      }

      .collab-footer {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        padding-top: 16px;
      }

      .collab-footer__label {
        font-family: var(--font-family);
        font-size: 11px;
        line-height: 10px;
        font-weight: var(--font-weight-normal);
        letter-spacing: normal;
        color: #c7c7c7;
        text-transform: none;
      }

      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .back-button {
        border: none;
        background: transparent;
        border-radius: var(--radius);
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-size: var(--text-sm);
        color: var(--secondary);
        margin-left: -12px;
        transition: background 0.2s ease;
      }

      .back-button:hover {
        background: #FCFCFC;
      }

      .back-button--asset .back-button__icon-wrap,
      .wg-hamburger .back-button__icon-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        background: #faf9f5;
        border-radius: 999px;
        color: #1d1d1f;
      }

      .back-button--asset .back-button__icon-wrap svg,
      .wg-hamburger .back-button__icon-wrap svg {
        display: block;
      }

      .content {
        position: absolute;
        inset-inline: 0;
        top: 0;
        bottom: 0;
        padding: 104px 16px 110px;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: none;
      }

      .content-results-component {
        padding-top: 118px;
      }

      .header--component-results {
        padding: 16px 16px 10px;
        transition: box-shadow 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .header--component-results.header--actions-pinned {
        box-shadow: 0 4px 12px rgba(152, 152, 166, 0.12);
      }

      .content-ds {
        padding-top: 160px;
      }

      .content::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      .footer {
        position: fixed;
        inset-inline: 0;
        bottom: 0;
        padding: 16px 32px;
        background: var(--background);
        box-shadow: 0 -4px 12px rgba(152, 152, 166, 0.15);
        display: flex;
        justify-content: center;
        z-index: 30;
      }

      .footer-inner {
        width: 100%;
        max-width: calc(var(--plugin-ui-width) - 64px);
      }

      .component-height-resize-handle {
        position: absolute;
        top: 0;
        left: 50%;
        width: 56px;
        height: 12px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: grab;
        touch-action: none;
        transform: translateX(-50%);
      }

      .component-height-resize-handle:active {
        cursor: grabbing;
      }

      .component-height-resize-handle::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 50%;
        width: 32px;
        height: 3px;
        border-radius: 999px;
        background: var(--secondary);
        transform: translateX(-50%);
      }

      .button-primary {
        width: 100%;
        padding: 12px 24px;
        border-radius: var(--radius-button);
        border: none;
        background: var(--primary);
        color: var(--primary-foreground);
        font-size: var(--text-base);
        font-weight: var(--font-weight-medium);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: opacity 0.2s ease;
      }

      .button-primary:hover:not(:disabled) {
        opacity: 0.9;
      }

      .button-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        background: var(--muted);
        color: var(--accent);
      }

      .button-primary.onboarding-screen__start-btn {
        width: 180px;
        padding: 12px 16px;
        flex-shrink: 0;
      }
    

      .button-secondary {
        padding: 8px;
        border-radius: var(--radius);
        border: none;
        background: transparent;
        color: var(--accent);
        font-size: var(--text-sm);
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .button-secondary:hover:not(:disabled) {
        background: #FCFCFC;
      }

      .icon-button {
        padding: 8px;
        border-radius: var(--radius);
        border: none;
        background: transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-size: 16px;
        transition: background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
      }

      .icon-button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .icon-button:hover:not([disabled]) {
        background: #FCFCFC;
      }

      .scan-card {
        padding: 16px;
        background: var(--card);
        border-radius: var(--radius);
        border: none;
        box-shadow: 0 4px 12px rgba(152, 152, 166, 0.25);
        display: flex;
        flex-direction: column;
        gap: 12px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .scan-card + .scan-card {
        margin-top: 12px;
      }

      .scan-card:hover {
        background: var(--accent-hover);
      }

      .scan-icon {
        width: 40px;
        height: 40px;
        border-radius: 16px;
        background: #F6F6F6;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1d1d1f;
        font-size: 18px;
      }

      .scan-title {
        font-size: var(--text-base);
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-weight: var(--font-weight-semibold);
      }

      .scan-description {
        font-size: var(--text-sm);
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-weight: var(--font-weight-normal);
        color: #57544d;
      }

      .centered {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .content-ready {
        position: relative;
        margin-top: 8px;
        padding: 0 16px 36px;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .scan-orbital {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 999px;
        background: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .scan-inner {
        width: 64px;
        height: 64px;
        border-radius: 999px;
        background: var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .scan-line {
        position: absolute;
        top: -100%;
        left: 0;
        right: 0;
        height: 30%;
        background: linear-gradient(
          to bottom,
          rgba(59, 130, 246, 0) 0%,
          rgba(59, 130, 246, 0.65) 50%,
          rgba(59, 130, 246, 0) 100%
        );
        animation: scan 1.6s infinite;
      }

      @keyframes scan {
        0% {
          top: -100%;

.wg-aria-value {

.wg-aria-info-wrap {

.wg-aria-info-icon {

  height: 16px;
  color: var(--destructive);
  display: block;
}

.wg-aria-tooltip {
  position: absolute;
  right: 0;
  bottom: calc(100% + 5px);

  color: #ffffff;
  font-size: var(--text-xs);

.wg-drawer-close {

  background: #fcfcfc;
}

  background: #f4f4f6;
  font-weight: var(--font-weight-semibold);
}

  var deps = null;

  function init(homeDeps) {
    deps = homeDeps;
  }

  function createFadeInItem(staggerIndex) {
    var el = document.createElement("div");
    el.className = "home-fade-item";
    el.setAttribute("data-stagger", String(staggerIndex));
    return el;
  }

  function triggerFadeIn(root) {
    root.classList.add("home-screen--animate");
  }

  function createHathaTitle(fontSizePx) {
    var title = document.createElement("h1");
    title.className = "hatha-title";
    title.style.fontSize = fontSizePx + "px";
    title.textContent = "hatha";
    return title;
  }

  function createCollabFooter() {
    var footer = document.createElement("footer");
    footer.className = "collab-footer";

    var label = document.createElement("span");
    label.className = "collab-footer__label";
    label.textContent = "Collab: Larissa Matos & Laura Reinas";

    footer.appendChild(label);
    return footer;
  }

  function createBackButton(onClick) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "back-button back-button--asset";
    btn.setAttribute("aria-label", "Back");
    btn.innerHTML =
      '<span class="back-button__icon-wrap" aria-hidden="true">' +
      ICON_BACK +
      "</span>";
    btn.onclick = onClick;
    return btn;
  }

  function createMenuHeader() {
    var header = document.createElement("header");
    header.className = "menu-screen__header";

    var back = createBackButton(function () {
      tutorialIndex = Math.max(0, TUTORIAL_SLIDES.length - 1);
      tutorialMount = null;
      deps.setState(deps.STATE.TUTORIAL);
    });

    var title = createHathaTitle(28);
    title.className = "hatha-title menu-screen__title";

    header.appendChild(back);
    header.appendChild(title);
    return header;
  }

  function createScanCard(iconHtml, titleText, descriptionText, onClick) {
    var card = document.createElement("div");
    card.className = "scan-card";
    card.onclick = onClick;

    var icon = document.createElement("div");
    icon.className = "scan-icon";
    icon.innerHTML = iconHtml;

    var title = document.createElement("div");
    title.className = "scan-title";
    title.textContent = titleText;

    var description = document.createElement("div");
    description.className = "scan-description";
    description.textContent = descriptionText;

    card.appendChild(icon);
    card.appendChild(title);
    card.appendChild(description);
    return card;
  }

  function createMenuCards() {
    var cardA11y = createScanCard(
      SCAN_ICON_A11Y,
      "Component Accessibility",
      "Scan for components and add accessibility documentation (labels, feedback, etc.).",
      function () {
        deps.startLoading("component");
        deps.postToPlugin({ type: "scan-components" });
      }
    );

    var cardWg = createScanCard(
      SCAN_ICON_WG,
      "Writing Guidelines",
      "A library of aria labels and usage examples, organized by component.",
      function () {
        deps.setState(deps.STATE.WRITING_GUIDELINES);
      }
    );

    return [cardA11y, cardWg];
  }

  function skipTutorial() {
    tutorialIndex = Math.max(0, TUTORIAL_SLIDES.length - 1);
    tutorialMount = null;
    deps.setState(deps.STATE.READY);
  }

  function goToTutorialSlide(nextIndex) {
    if (nextIndex < 0 || nextIndex >= TUTORIAL_TOTAL) return;
    if (nextIndex === tutorialIndex) return;
    if (!TUTORIAL_SLIDES[nextIndex]) {
      skipTutorial();
      return;
    }
    var fromIndex = tutorialIndex;
    tutorialIndex = nextIndex;
    renderTutorial(fromIndex);
  }

  function createTutorialDots(activeIndex) {
    var dots = document.createElement("div");
    dots.className = "tutorial-screen__dots";
    dots.setAttribute("aria-label", "Tutorial progress");

    var track = document.createElement("div");
    track.className = "tutorial-screen__dots-track";

    for (var i = 0; i < TUTORIAL_TOTAL; i++) {
      var dot = document.createElement("span");
      dot.className = "tutorial-screen__dot";
      track.appendChild(dot);
    }

    var active = document.createElement("span");
    active.className = "tutorial-screen__dots-active";
    active.style.setProperty("--tutorial-dot-index", String(activeIndex));
    track.appendChild(active);
    dots.appendChild(track);
    return dots;
  }

  function setTutorialDotIndex(index, animate) {
    if (!tutorialMount || !tutorialMount.activeDot) return;
    if (!animate) {
      tutorialMount.activeDot.style.transition = "none";
      tutorialMount.activeDot.style.setProperty(
        "--tutorial-dot-index",
        String(index)
      );
      void tutorialMount.activeDot.offsetWidth;
      tutorialMount.activeDot.style.transition = "";
      return;
    }
    tutorialMount.activeDot.style.setProperty(
      "--tutorial-dot-index",
      String(index)
    );
  }

  function replayTutorialContentFade() {
    if (!tutorialMount || !tutorialMount.content) return;
    var items = tutorialMount.content.querySelectorAll(".home-fade-item");
    for (var i = 0; i < items.length; i++) {
      items[i].style.animation = "none";
    }
    void tutorialMount.content.offsetWidth;
    for (var j = 0; j < items.length; j++) {
      items[j].style.animation = "";
    }
    tutorialMount.screen.classList.add("home-screen--animate");
  }

  function updateTutorialNav() {
    if (!tutorialMount) return;

    tutorialMount.leftSlot.innerHTML = "";
    if (tutorialIndex > 0) {
      var prevBtn = document.createElement("button");
      prevBtn.type = "button";
      prevBtn.className = "tutorial-screen__icon-btn";
      prevBtn.setAttribute("aria-label", "Previous");
      prevBtn.innerHTML = ICON_ARROW_LEFT;
      prevBtn.onclick = function () {
        goToTutorialSlide(tutorialIndex - 1);
      };
      tutorialMount.leftSlot.appendChild(prevBtn);
    }

    tutorialMount.rightSlot.innerHTML = "";
    var nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.className = "tutorial-screen__icon-btn";
    nextBtn.setAttribute("aria-label", "Next");
    nextBtn.innerHTML = ICON_ARROW_RIGHT;
    if (tutorialIndex < TUTORIAL_TOTAL - 1) {

      tutorialIndex === 1 ||
      tutorialIndex === 2 ||
      tutorialIndex === 3 ||
      tutorialIndex === 4 ||
      tutorialIndex === 5 ||
      tutorialIndex === 6 ||

      if (tutorialIndex === 1 || tutorialIndex === 2) {
        tutorialMount.image.classList.add("tutorial-screen__image--sm");
      } else {
        tutorialMount.image.classList.remove("tutorial-screen__image--sm");
      }
      if (tutorialIndex === 7) {
        tutorialMount.image.classList.add("tutorial-screen__image--rounded");
      } else {
        tutorialMount.image.classList.remove("tutorial-screen__image--rounded");

  function formatTutorialStep(index) {
    return String(index + 1).padStart(2, "0");
  }

    var nextText = formatTutorialStep(tutorialIndex);
    var track = tutorialMount.stepTrack;
    var current = track.querySelector(".tutorial-screen__step-num-value");
    if (!current) return;

    if (tutorialMount.stepEl) {
      tutorialMount.stepEl.setAttribute(
        "aria-label",
        "Step " + nextText + " of " + formatTutorialStep(TUTORIAL_TOTAL - 1)

      track.style.transition = "none";
      track.style.transform = "translateY(0)";
      void track.offsetWidth;
      track.style.transition = "";
      track.style.transform = "translateY(-100%)";

      track.insertBefore(incoming, current);

    var stepTrack = document.createElement("span");
    stepTrack.className = "tutorial-screen__step-num-track";

    stepValue.className = "tutorial-screen__step-num-value";
    stepValue.textContent = formatTutorialStep(tutorialIndex);
    stepTrack.appendChild(stepValue);
    stepViewport.appendChild(stepTrack);
    stepNum.appendChild(stepViewport);
    stepEl.appendChild(stepLabel);
    stepEl.appendChild(stepNum);

    var imageWrap = createFadeInItem(0);
    imageWrap.className += " tutorial-screen__image-wrap";
    var image = document.createElement("img");
    image.className = "tutorial-screen__image";
    image.src = slide.image;
    image.alt = "";
    image.setAttribute("loading", "eager");
    imageWrap.appendChild(image);

    var title = document.createElement("h1");
    title.className = "tutorial-screen__title";
    title.textContent = slide.title;
    titleWrap.appendChild(title);

    var copyWrap = createFadeInItem(2);
    var copy = document.createElement("p");
    copy.className = "tutorial-screen__copy";
    copy.textContent = slide.body;
    copyWrap.appendChild(copy);

    content.appendChild(imageWrap);
    content.appendChild(titleWrap);
    content.appendChild(copyWrap);

    var dots = createTutorialDots(tutorialIndex);
    var activeDot = dots.querySelector(".tutorial-screen__dots-active");

    body.appendChild(stepEl);
    body.appendChild(content);
    body.appendChild(dots);

    var footer = createFadeInItem(3);
    footer.className += " tutorial-screen__footer";

    var leftSlot = document.createElement("div");
    leftSlot.className = "tutorial-screen__footer-slot";

    var skipBtn = document.createElement("button");
    skipBtn.type = "button";
    skipBtn.className = "tutorial-screen__skip";
    skipBtn.textContent = "Skip tutorial";
    skipBtn.onclick = skipTutorial;

    var rightSlot = document.createElement("div");
    rightSlot.className = "tutorial-screen__footer-slot";

    footer.appendChild(leftSlot);
    footer.appendChild(skipBtn);
    footer.appendChild(rightSlot);

    screen.appendChild(body);
    screen.appendChild(footer);
    deps.app.appendChild(screen);

    tutorialMount = {
      screen: screen,
      content: content,
      image: image,
      title: title,
      copy: copy,
      activeDot: activeDot,
      leftSlot: leftSlot,
      rightSlot: rightSlot,
      skipBtn: skipBtn,
      stepEl: stepEl,
      stepTrack: stepTrack,
    };

    updateTutorialContentLayout();
    updateTutorialNav();
    triggerFadeIn(screen);
  }

  function renderMenu() {
    if (!deps || !deps.app) return;
    deps.app.innerHTML = "";

    var screen = document.createElement("div");
    screen.className = "home-screen menu-screen";

    var headerWrap = createFadeInItem(0);
    headerWrap.appendChild(createMenuHeader());
    screen.appendChild(headerWrap);

    for (var i = 0; i < cards.length; i++) {

    footerWrap.className += " onboarding-screen__footer-wrap";
    footerWrap.appendChild(createCollabFooter());
    screen.appendChild(footerWrap);
    deps.app.appendChild(screen);

    triggerFadeIn(screen);
  }

    init: init,
    renderTutorial: renderTutorial,

        };

      function handoffRestoreSnapshotState(snapshot) {
        if (!snapshot) return;
        handoffIsRestoringUndo = true;
        detectedComponents = handoffClonePlain(snapshot.detectedComponents) || [];
        componentDetails = handoffClonePlain(snapshot.componentDetails) || {};
        expandedContainerIds.clear();
        (snapshot.expandedContainerIds || []).forEach((id) => expandedContainerIds.add(id));
        expandedChildCardIds.clear();
        (snapshot.expandedChildCardIds || []).forEach((id) => expandedChildCardIds.add(id));
        handoffNewManualHighlightIds.clear();
        (snapshot.handoffNewManualHighlightIds || []).forEach((id) => handoffNewManualHighlightIds.add(id));
        handoffPendingManualAddAnimId = snapshot.handoffPendingManualAddAnimId || null;
        showValidationErrors = !!snapshot.showValidationErrors;
        lastValidationErrorCount = snapshot.lastValidationErrorCount || 0;
        handoffSyncSortYToGlobalDfsOrder();
        renderResultsComponent(snapshot.scrollPos);
        handoffIsRestoringUndo = false;

      function handoffPushUndoState() {
        if (handoffIsRestoringUndo || currentState !== STATE.RESULTS_COMPONENT) return;
        handoffUndoStack.push(handoffSnapshotState());
        if (handoffUndoStack.length > HANDOFF_UNDO_LIMIT) handoffUndoStack.shift();

      function handoffUndoLastAction() {

        showSnackbar("Action undone");

      function handoffMergeRefreshComponents(incoming, previousComponents) {
        function normalizePreservedComponent(comp) {
          if (!comp || typeof comp !== "object") return comp;
          const out = { ...comp, type: normalizeComponentType(comp.type) };
          if (Array.isArray(out.listItems)) {
            out.listItems = out.listItems.map((item) =>
              item && typeof item === "object"
                ? { ...item, type: normalizeComponentType(item.type) }
                : item
            );
          }
          return out;
        }
        function isRefreshPreservedManualComponent(comp) {
          if (!comp || comp.id == null) return false;
          const id = String(comp.id);
          return (
            id.indexOf("manual-") === 0 ||
            id === SCREEN_TITLE_FIXED_ID ||
            comp.type === SCREEN_TITLE_TYPE
          );
        }

        const incomingById = new Map();
        (incoming || []).forEach((comp) => {
          if (comp && comp.id != null) incomingById.set(String(comp.id), comp);
        });

        const merged = [];
        const seen = new Set();
        (previousComponents || []).forEach((previous) => {
          if (!previous || previous.id == null) return;
          previous = normalizePreservedComponent(previous);
          const id = String(previous.id);
          const scanned = incomingById.get(id);
          seen.add(id);
          if (scanned) {
            merged.push({
              ...scanned,
              type: previous.type || scanned.type,
              presetGrouping:
                previous.presetGrouping != null
                  ? previous.presetGrouping
                  : scanned.presetGrouping,
              manualInternalReadContainer:
                previous.manualInternalReadContainer != null
                  ? previous.manualInternalReadContainer
                  : scanned.manualInternalReadContainer,
              _sortY:
                previous._sortY != null ? previous._sortY : scanned._sortY,
              _sortX:
                previous._sortX != null ? previous._sortX : scanned._sortX,
              _scanSortY:
                scanned._scanSortY != null ? scanned._scanSortY : previous._scanSortY,
              _scanSortX:
                scanned._scanSortX != null ? scanned._scanSortX : previous._scanSortX,
            });
          } else if (isRefreshPreservedManualComponent(previous)) {
            merged.push(previous);
          }
        });

        (incoming || []).forEach((comp) => {
          if (!comp || comp.id == null) return;
          if (seen.has(String(comp.id))) return;
          merged.push(comp);
        });

        return merged;
      }

      function orderHeadingVariants(variants) {
        if (!variants || variants.length === 0) return [];
        const back = [];
        const text = [];
        const action = [];
        for (let i = 0; i < variants.length; i++) {
          const v = String(variants[i]).toLowerCase().replace(/\s+/g, " ").trim();
          if (v.indexOf("back") >= 0 && (v.indexOf("button") >= 0 || v.indexOf("btn") >= 0)) {
            back.push(variants[i]);
          } else if (v.indexOf("action") >= 0 && (v.indexOf("button") >= 0 || v.indexOf("btn") >= 0)) {
            action.push(variants[i]);
          } else {
            text.push(variants[i]);
          }
        }
        return back.concat(text, action);
      }

      function getStandardA11yText(typeName, listItemExtras, headingVariants) {
        const t = typeName || "Component";
        const appendListFields = (base) => {
          if (listItemExtras && listItemExtras.activeTextFields && listItemExtras.activeTextFields.length) {
            return base + " Active text fields in order: " + listItemExtras.activeTextFields.join(", ") + ".";
          }
          return base;
        };
        if (t === "Decorative Image") {
          return "Decorative Image element. It has no alternative text and should not be read by a screen reader.";
        }
        if (t === "Text Headline" || t === "Text Body") {
          return appendListFields("Text element, read exactly as the interface.");
        }
        if (
          t === "Buttons" ||
          t === "Button Primary" ||
          t === "Button Secondary" ||
          t === "Button Link" ||
          t === "Button"
        ) {
          return appendListFields("Button element, read exactly as the interface/label.");
        }
        if (t === "Heading" || t === "Heading • Grouping") {
          if (headingVariants && headingVariants.length > 0) {
            const ordered = orderHeadingVariants(headingVariants);
            return (
              "Heading element. In this variant, the following are active (read in this order): " +
              ordered.join(", ") +
              ". If back-button is active, the icon is on the left; then the text/headline; if action-button is active, it appears after the text."
            );
          }
          return "Heading element. Items are read separately: back button (left) if present, then text/headline, then action button (right) if present. Read in order from left to right, top to bottom.";
        }
        if (t === "Section Title" || t === "Section Title • Grouping") {
          if (headingVariants && headingVariants.length > 0) {
            const stOrdered = orderHeadingVariants(headingVariants);
            return (
              "Section title element. In this variant, the following are active (read in this order): " +
              stOrdered.join(", ") +
              ". Read headline, body, and action only when present in the interface."
            );
          }
          return "Section title element. Read headline, body, and action in order from left to right, top to bottom, only for items present in the interface.";
        }
        if (t === "Progress Bar") {
          return "Progress bar element, read with current value and state.";
        }
        if (t === "Checkbox" || t === "Radio Button" || t === "Switch") {
          return appendListFields(`${t} element, read with label and state (checked/unchecked, on/off).`);
        }
        if (t === "SnackBar" || t === "Snackbar" || t === "Snackbar • Grouping") {
          return "SnackBar element, read as notification with message and action if present.";
        }
        if (t === "Banner" || t === "BottomSheet") {
          return `${t} element, read exactly as the interface/label.`;
        }
        if (t === "Footer Card") {
          return "Footer Card element, read with content and actions as shown in the interface.";
        }
        if (t === "Text Field" || t === "Text Field • Grouping") {
          return "Text Field element. Read label, value, helper text, and action as shown in the interface.";
        }
        if (t === "Section Title") {
          return "Section title element, read as heading or label for the section.";
        }
        if (t === "List") {
          return "Announces to screen readers the total number of items and the position of each item in the list.";
        }
        if (t === "Grouping") {
          return "Elements are read sequentially, automatically and without and no time limit. Inform the position in the list.";
        }
        if (t === "Ordered list") {
          return "Announces list and item positions. Read each list item in order with its position.";
        }
        if (t === "Tags") {
          return appendListFields("Tags element. Read each tag with its label. Used for categorization or selection.");
        }
        if (t === "Chips") {
          return appendListFields("Chips element. Read each chip with its label. Used for selection, filtering or multi-choice.");
        }
        if (t === "Rating") {
          return "Rating element. Read with current value (e.g. stars or score) and optionally the scale (e.g. out of 5).";
        }
        return appendListFields(`${t} element, read exactly as the interface/label.`);
      }

      function handoffListItemShouldRenderCustomHandoffRows(listItem) {
        if (!listItem || !listItem.customData || typeof listItem.customData !== "object") {
          return false;
        }
        const cd = listItem.customData;
        const keys = ["labelAlternative", "supplementary", "feedback"];
        for (let i = 0; i < keys.length; i++) {
          const data = cd[keys[i]];
          if (data && data.enabled && String(data.text || "").trim() !== "") {
            return true;
          }
        }
        const dg = cd.designerGuidance;
        if (typeof dg === "string" && String(dg).trim() !== "") {
          return true;
        }
        if (dg && typeof dg === "object" && dg.enabled && String(dg.text || "").trim() !== "") {
          return true;
        }
        return false;
      }

      function handoffBuildAccessibilityListItem(compId, compMap, globalIndexMap) {
        const resolvedId = handoffResolveComponentDetailsId(compId);
        const comp = compMap[compId] || compMap[resolvedId] || getCompById(compId);
        if (!comp) return null;
        const details = componentDetails[resolvedId] || componentDetails[compId] || {};
        const children = getChildrenIds(comp.id);
        const atomicSimple =
          typeof WELLHUB_COMPONENT_REGISTRY !== "undefined" &&
          WELLHUB_COMPONENT_REGISTRY.isSimpleAtomicHandoffType(comp.type);
        const isBundle = children.length > 0 && !atomicSimple;
        const itemType = isBundle
          ? details.containerType || comp.type || "Grouping"
          : comp.type || "Component";
        const item = {
          id: comp.id,
          name: comp.name,
          type: itemType,
          globalIndex: handoffLookupGlobalIndex(globalIndexMap, comp.id),
          mode: details.mode || "standard",
          customData: details.customData || {},
          activeTextFields: comp.activeTextFields,
          rightComponent: comp.rightComponent,
          headingVariants: comp.headingVariants,
        };
        if (isBundle) {
          const nestedItems = children
            .map((cid) =>
              handoffBuildAccessibilityListItem(cid, compMap, globalIndexMap)
            )
            .filter(Boolean);
          if (nestedItems.length) item.nestedItems = nestedItems;
        }
        return item;
      }

      function handoffAppendPreviewListItemBlock(parentEl, listItem, idx) {
        const hr = document.createElement("div");

        header.appendChild(idxSpan);

        const isItemCustom = handoffListItemShouldRenderCustomHandoffRows(listItem);
        if (isItemCustom) {

          const previewItemLabelMap = {
            labelAlternative: "ALTERNATIVE:",

              const row = document.createElement("div");
              row.className = "preview-custom-row";

          });
          if (fields.childNodes.length) itemBlock.appendChild(fields);

        } else {
          const listItemExtras =
            listItem.activeTextFields || listItem.rightComponent
              ? {
                  activeTextFields: listItem.activeTextFields,
                  rightComponent: listItem.rightComponent,

              : undefined;

          reading.className = "preview-standard-text";

          itemBlock.appendChild(reading);

        parentEl.appendChild(itemBlock);

        if (listItem.nestedItems && listItem.nestedItems.length) {
          const nestedWrap = document.createElement("div");
          nestedWrap.style.paddingLeft = "8px";
          listItem.nestedItems.forEach((nested, ni) => {
            handoffAppendPreviewListItemBlock(nestedWrap, nested, ni);

      /** Mesma estrutura do card gerado no Figma para List/Grouping/Ordered list com listItems. */
      function appendPreviewGroupedListContent(contentEl, comp) {

        const intro = document.createElement("p");

      function waitRemainingMinLoading(callback) {
        const elapsed = Date.now() - loadingScreenShownAt;
        const delay = Math.max(0, MIN_LOADING_VISIBLE_MS - elapsed);
        setTimeout(callback, delay);
      }

      let dragListAutoScrollActive = false;

      function dragListAutoScrollOnDragOver(e) {
        if (!dragListAutoScrollActive) return;
        const scrollable = document.querySelector(".content.content-results-component");
        if (!scrollable) return;
        const rect = scrollable.getBoundingClientRect();
        const edge = 72;
        const maxStep = 14;
        const y = e.clientY;
        if (y >= rect.top && y < rect.top + edge) {
          const t = (rect.top + edge - y) / edge;
          scrollable.scrollTop = Math.max(
            0,
            scrollable.scrollTop - Math.max(3, maxStep * t)
          );
        } else if (y > rect.bottom - edge && y <= rect.bottom) {
          const t = (y - (rect.bottom - edge)) / edge;
          const maxScroll = scrollable.scrollHeight - scrollable.clientHeight;
          scrollable.scrollTop = Math.min(
            maxScroll,
            scrollable.scrollTop + Math.max(3, maxStep * t)
          );
        }
      }

      function startDragListAutoScroll() {
        if (dragListAutoScrollActive) return;
        dragListAutoScrollActive = true;
        document.addEventListener("dragover", dragListAutoScrollOnDragOver, true);
      }

      function stopDragListAutoScroll() {
        if (!dragListAutoScrollActive) return;
        dragListAutoScrollActive = false;
        document.removeEventListener("dragover", dragListAutoScrollOnDragOver, true);
      }

      function setState(nextState) {
        currentState = nextState;
        applyPluginUIHeight(getPluginUIHeightForState(nextState));
        render();
      }

      function startLoading(mode) {
        currentMode = mode;
        loadingProgress = 0;
        loadingScreenShownAt = Date.now();
        setState(STATE.LOADING);

        if (loadingInterval) clearInterval(loadingInterval);
        loadingInterval = setInterval(() => {
          loadingProgress = Math.min(100, loadingProgress + Math.random() * 25);
          updateLoadingProgress();
          if (loadingProgress >= 100) {
            clearInterval(loadingInterval);
          }
        }, 350);

        // Fallback: se nada responder em até 10s, voltamos para READY
        setTimeout(() => {
          if (currentState === STATE.LOADING) {
            alert(
              "The scan took longer than expected. Make sure the plugin is up to date and try again."
            );
            setState(STATE.READY);
          }
        }, 10000);
      }

      function updateLoadingProgress() {
        const bar = document.querySelector(".progress-bar-inner");
        const label = document.querySelector(".progress-label");
        if (!bar || !label) return;
        bar.style.width = loadingProgress + "%";
        label.textContent = Math.round(loadingProgress) + "% completed";
      }

      const RENDER_FN = {
        [STATE.TUTORIAL]: () => renderTutorial(),
        [STATE.READY]: () => renderReady(),
        [STATE.LOADING]: () => renderLoading(),
        [STATE.RESULTS_COMPONENT]: () => renderResultsComponent(),
        [STATE.RESULTS_DS]: () => renderResultsDS(),
        [STATE.WRITING_GUIDELINES]: () => renderWritingGuidelines(),
        [STATE.PREVIEW]: () => renderPreview(),
      };

      function render() {
        const fn = RENDER_FN[currentState];
        if (fn) fn();
      }

      function renderTutorial() {
        if (typeof HomeScreens === "undefined") {
          console.error("HomeScreens module failed to load.");
          return;
        }
        HomeScreens.renderTutorial();
      }

      function renderReady() {
        if (typeof HomeScreens === "undefined") {
          console.error("HomeScreens module failed to load.");
          return;
        }
        HomeScreens.renderMenu();
      }

      function loadingMessage() {
        if (loadingProgress < 33) return "Detecting components...";
        if (loadingProgress < 66) return "Analyzing accessibility...";
        return "Preparing results...";
      }

      function renderLoading() {
        app.innerHTML = "";

        const content = document.createElement("div");

        const scanWrap = document.createElement("div");
        mountLoadingGif(scanWrap);

        const t = document.createElement("div");
        t.className = "scan-title-loading";
        t.textContent = "Scanning Components";

        const s = document.createElement("div");
        s.className = "scan-subtitle-loading";

        const bar = document.createElement("div");
        bar.className = "progress-bar";
        const innerBar = document.createElement("div");
        innerBar.className = "progress-bar-inner";
        bar.appendChild(innerBar);

        const label = document.createElement("div");

        content.appendChild(scanWrap);
        content.appendChild(t);
        content.appendChild(s);
        content.appendChild(bar);
        content.appendChild(label);

        app.appendChild(content);

        updateLoadingProgress();
      }

          const animate = !options || options.animate !== false;
          if (pinned === actionsPinned) return;

          const first = actionsGroup.getBoundingClientRect();

          if (pinned) {
            const ph = document.createElement("div");
            ph.className = "handoff-actions-placeholder";
            ph.style.width = `${Math.max(first.width, 1)}px`;

          const last = actionsGroup.getBoundingClientRect();
          const dx = first.left - last.left;
          const dy = first.top - last.top;
          if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {

                { transform: "translate(0, 0)" },

              function setMode(mode) {

            if (hasChildren) {

               groupedSection.appendChild(groupedTitle);
               const groupedContainer = document.createElement("div");
               groupedContainer.className = "grouped-items-container";
               handoffMountGroupedChildCards(groupedContainer, comp.id, groupedIds, {

              wrapper.appendChild(card);

              card.appendChild(header);
              card.appendChild(body);

              listContainer.appendChild(wrapper);
            });
          }

          recalcStats();
